# The folder layout of orm (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml and the map
# of this repository. An entry below is a permanent part of orm's layout with its reason; a folder or file that S5 refuses
# and that has to move is no exception here, so layout-check reports it until it moves (the T137 rows of the checklist).
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: orm }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: orm }

  # packages/ holds the runtime ports of orm and the four components of the dbspec editor stack, each a TypeScript package
  # with no ports in other runtimes (docs/editor.md): the language service, the language server, the CodeMirror extension
  # and the VS Code extension.
  - id: layout-packages
    paths:
      - "packages/*"
      - "!packages/go"
      - "!packages/php"
      - "!packages/php-ext"
      - "!packages/python"
      - "!packages/rust"
      - "!packages/ts"
      - "!packages/js"
      - "!packages/dbspec-language"
      - "!packages/dbspec-lsp"
      - "!packages/dbspec-codemirror"
      - "!packages/dbspec-vscode"

  # S5: the root files of the repository besides those of kit (config/layout.kit.yml): VERSION, the one version of the
  # repository that config/release.json names and the version-bump commit sets, and the community health files, which
  # GitHub reads only from the root, .github/ or docs/, each with its Korean twin (K145).
  - id: layout-root-files
    vars: { root_files: "{VERSION,CODE_OF_CONDUCT.md,CODE_OF_CONDUCT.ko.md,CONTRIBUTING.md,CONTRIBUTING.ko.md,SECURITY.md,SECURITY.ko.md}" }

  # S7: the root tests/ holds what every client runs or is compared by, and the tests of the repository's own tools.
  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/kit"
      # Shared vectors and the cross-language runners that compare the clients' results.
      - "!tests/bind"
      - "!tests/codec"
      - "!tests/conformance"
      - "!tests/dbspec"
      - "!tests/dsn"
      - "!tests/editor"
      - "!tests/events"
      # The scan vectors that the PHP generator and the node generator are both compared with (OrmGenScanParityTest).
      - "!tests/generator"
      - "!tests/interfaces"
      - "!tests/ir"
      - "!tests/markdown"
      # The CPU-time measurements of every client under a preempted process group (make timing-check).
      - "!tests/timing"
      # The time zone that WITH_TEST_ENV gives the PHP of every database client.
      - "!tests/timezone"
      # The consumer projects in which the release installs its archives (config/release.json consumers).
      - "!tests/release-consumer"
      # The tests of the repository's tools: the CLI install, the dbs fence of the documentation site, and the lease,
      # session and process programs of the check runner.
      - "!tests/cli"
      - "!tests/docs"
      - "!tests/lease"
      - "!tests/stop-process"
      # The go/analysis analyzers of the repository's rules for Go source, which make go-vet-check/orm runs with go vet.
      - "!tests/analyzers"

  # S9 exceptions. Each test or tool below is of its own ecosystem, not cross-language infrastructure.
  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "!tests/kit/fixture/**"
      # The runners of one language: each drives the client of its language through the shared vectors and writes the
      # form that the TypeScript comparators read, so it is a test of that language.
      - "!tests/dbspec/cases.php"
      - "!tests/dbspec/vectors.php"
      - "!tests/dbspec/input.php"
      # The symbol extractors of one language read its declarations with its own parser (Go's go/parser, PHP's tokens,
      # Python's ast, Rust's syn), with the tests of the Python extractor.
      # The Go tests of the interface manifest contracts/interfaces.json: they read it and refuse a native adapter that
      # drifts from its logical signature, as a test of the Go tests module.
      - "!tests/interfaces/contracts/**"
      # The Go tests of the engine's dialect rules: the probes of docs/dialects.md and the physical tests of the engine's
      # DDL, plans, apply and introspection against the databases, which run the Go engine.
      # The table of Unicode letters and digits that every lexer reads is written from the data of Go's unicode package,
      # the reference of packages/go/engine/dbspec.
      - "!tests/dbspec/unicode/**"
      # The codec vectors are the output of the PHP codecs, the ground truth of docs/codec.md.
      - "!tests/codec/gen.php"
      # Programs that need operating-system calls Node does not offer: setsid for the lease releaser, and
      # the exit notification of another process (kqueue, pidfd) for stop-process.
      - "!tests/lease/**"
      - "!tests/stop-process/**"
      # The rules of this repository for Go source are go/analysis analyzers, the plugins of Go's own analyzer that go vet
      # runs (go vet -vettool) over the syntax trees and types of the compiler, with their testdata packages.
      - "!tests/analyzers/**"

  # The Python symbol extractor runs as a program of its interpreter (its shebang), an exception of the rule above.
  - id: layout-infrastructure-shebang
    paths: ["scripts/**", "tests/**", "!tests/kit/fixture/**"]
