# The golangci-lint configuration of orm, taken from kit's own (kit docs/examples/native-settings, K1050). make lint-go runs
# golangci-lint in each Go module, and golangci-lint finds this file by its search from the module folder upward.
version: "2"
run:
  # The paths of the findings are taken from the git root, so a finding of a nested module names its path in the repository.
  relative-path-mode: gitroot
linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck and unused; errcheck refuses an unchecked error (K256).
  default: standard
  enable:
    # P8, errors are never hidden (K334): nilerr an error checked and then returned as nil, errorlint a comparison, assertion
    # or %v wrap that loses the error chain, nolintlint a nolint without its linter and its reason.
    - nilerr
    - errorlint
    - nolintlint
  settings:
    errcheck:
      # An error assigned to the blank identifier (`x, _ := f()`, `_ = f()`) is a dropped error, and so is an unchecked
      # type assertion; neither is excluded.
      check-blank: true
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    staticcheck:
      # The default checks of golangci-lint 2 (.golangci.reference.yml) without ST1005, "error strings should not be
      # capitalized": a polyspec error string is a cross-port message of the repository's spec, which every port returns
      # byte for byte, so it keeps the spec's capitalization (K164).
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1005"]
issues:
  # Every finding is reported: the default caps of 3 issues of the same text and 50 of one linter hid 118 of 121 findings
  # in a repository (K164).
  max-issues-per-linter: 0
  max-same-issues: 0
