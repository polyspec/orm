# Error codes shared by the planner and every executor. `ormgen errors --lang go|php|rust`
# generates one constants file per language from this file; codes are the stable `error.code`.
# origin: engine = raised while planning a request in the client process;
#         executor = raised by the language runtime; driver = reported by the DB driver: the listed
#         conditions map to their code, every other driver error maps to DRIVER; each keeps the
#         driver message and the driver error as its cause.
codes:
  # ---- request ----
  - code: VERSION_MISMATCH        # ir_version the engine does not speak
    origin: engine
  - code: SCHEMA_HASH_MISMATCH    # client generated from another schema.json than the engine loaded
    origin: engine
  - code: SCHEMA_INVALID          # schema.json failed validation at load
    origin: engine
  - code: DIALECT_UNKNOWN
    origin: engine
  - code: IR_INVALID              # structural: missing fields, wrong combination, param index out of range
    origin: engine
  - code: CAPABILITY_UNSUPPORTED  # requested operation is not supported by the selected dialect
    origin: engine
  # ---- schema references ----
  - code: ENTITY_UNKNOWN
    origin: engine
  - code: COLUMN_UNKNOWN
    origin: engine
  - code: RELATION_UNKNOWN
    origin: engine
  - code: INDEX_UNKNOWN           # force_index name not declared
    origin: engine
  - code: COLUMN_ALIAS_CONFLICT   # select<Col>As name collides with a column
    origin: engine
  # ---- predicates ----
  - code: OPERATOR_UNKNOWN
    origin: engine
  - code: FUNCTION_UNKNOWN        # ORM function name outside the column or value function catalog
    origin: engine
  - code: OPERATOR_NOT_ALLOWED    # op not valid for the column's type/style (ir.OpAllowed)
    origin: engine
  - code: OR_AT_GROUP_START       # or() as the first item of a group
    origin: engine
  - code: EMPTY_IN                # in()/notIn() with no values
    origin: engine
  - code: ENTITY_NOT_JOINED       # joined placement or column reference to a join missing from this statement
    origin: engine
  - code: LIMIT_IN_RELATION       # limit() on a relation child (use limitPerParent)
    origin: engine
  # ---- executor ----
  - code: NO_ROWS                # strict one-row query matched no row
    origin: executor
  - code: COLUMN_UNSELECTED      # a requested column was not included in the loaded row
    origin: executor
  - code: OPTIMISTIC_LOCK         # updateOptimistic matched no row (updated_ts changed)
    origin: executor
  - code: CODEC_DECODE            # styled column bytes could not be decoded (docs/codec.md)
    origin: executor
  - code: CODEC_ENCODE           # a styled input cannot be encoded, including SQL NULL for a non-null column
    origin: executor
  - code: CODEC_UNSUPPORTED       # PHP objects/references in serialize, unknown style
    origin: executor
  - code: CONFIG                  # missing secret, bad DSN/paths, transaction misuse
    origin: executor
  - code: CANCELED                # the statement stopped before it finished: its context or abort signal was cancelled, or a timeout bound expired (statement timeout, transaction timeoutMs, SQLite busy_timeout)
    origin: executor
  - code: ROLLBACK                # a transaction or savepoint callback failed and its rollback failed too; the error keeps both errors
    origin: executor
  - code: INTERNAL
    origin: executor
  # ---- driver (mapped) ----
  - code: LOCK_NOT_AVAILABLE      # a NOWAIT lock could not be acquired immediately
    origin: driver
  - code: DEADLOCK                # MySQL 1213 / SQLSTATE 40001 / PostgreSQL 40P01 / SQLite LOCKED; retries require TransactionOptions
    origin: driver
  - code: DUPLICATE_KEY           # MySQL 1062 / SQLSTATE 23000
    origin: driver
  - code: FOREIGN_KEY             # MySQL 1451/1452 / PostgreSQL 23503 / SQLite 787
    origin: driver
  - code: CONSTRAINT              # MySQL 3819/4025 / PostgreSQL 23514 / SQLite 275
    origin: driver
  - code: READ_ONLY               # a write rejected because the server or connection is read-only: MySQL 1290/1792 / PostgreSQL 25006 / SQLite 8 and its extended codes
    origin: driver
  - code: DRIVER                  # any other driver error, such as a write that a trigger refuses: MySQL 1644 / PostgreSQL P0001 / SQLite 1811
    origin: driver
