# Error codes shared by the planner and every executor. `ormgen errors --lang go|php|rust`
# generates one constants file per language from this file; codes are the stable `error.code`.
# origin: engine = raised while planning a request in the client process;
#         executor = raised by the language runtime; driver = passed through from the DB driver
#         with the original message, only the listed ones are mapped to a code.
codes:
  # ---- request ----
  - code: VERSION_MISMATCH        # ir_version the engine does not speak
    origin: engine
  - code: SCHEMA_HASH_MISMATCH    # client generated from another schema.json than the engine loaded
    origin: engine
  - code: SCHEMA_INVALID          # schema.json failed validation at load
    origin: engine
  - code: DIALECT_UNKNOWN
    origin: engine
  - code: IR_INVALID              # structural: missing fields, wrong combination, param index out of range
    origin: engine
  - code: CAPABILITY_UNSUPPORTED  # requested operation is not supported by the selected dialect
    origin: engine
  # ---- schema references ----
  - code: ENTITY_UNKNOWN
    origin: engine
  - code: COLUMN_UNKNOWN
    origin: engine
  - code: RELATION_UNKNOWN
    origin: engine
  - code: INDEX_UNKNOWN           # force_index name not declared
    origin: engine
  - code: COLUMN_ALIAS_CONFLICT   # select<Col>As name collides with a column
    origin: engine
  # ---- predicates ----
  - code: OPERATOR_UNKNOWN
    origin: engine
  - code: FUNCTION_UNKNOWN        # ORM function name outside the column or value function catalog
    origin: engine
  - code: OPERATOR_NOT_ALLOWED    # op not valid for the column's type/style (ir.OpAllowed)
    origin: engine
  - code: OR_AT_GROUP_START       # or() as the first item of a group
    origin: engine
  - code: EMPTY_IN                # in()/notIn() with no values
    origin: engine
  - code: ENTITY_NOT_JOINED       # joined placement or column reference to a join missing from this statement
    origin: engine
  - code: LIMIT_IN_RELATION       # limit() on a relation child (use limitPerParent)
    origin: engine
  # ---- executor ----
  - code: NO_ROWS                # strict one-row query matched no row
    origin: executor
  - code: OPTIMISTIC_LOCK         # updateOptimistic matched no row (updated_ts changed)
    origin: executor
  - code: CODEC_DECODE            # styled column bytes could not be decoded (docs/codec.md)
    origin: executor
  - code: CODEC_ENCODE
    origin: executor
  - code: CODEC_UNSUPPORTED       # PHP objects/references in serialize, unknown style
    origin: executor
  - code: CONFIG                  # missing secret, bad DSN/paths, transaction misuse
    origin: executor
  - code: CANCELED                # the statement stopped before it finished: its context or abort signal was cancelled, or a timeout bound expired (statement timeout, transaction timeoutMs)
    origin: executor
  - code: INTERNAL
    origin: executor
  # ---- driver (mapped) ----
  - code: DEADLOCK                # MySQL 1213 / SQLSTATE 40001; retries require TransactionOptions
    origin: driver
  - code: DUPLICATE_KEY           # MySQL 1062 / SQLSTATE 23000
    origin: driver
  - code: FOREIGN_KEY             # MySQL 1451/1452 / PostgreSQL 23503 / SQLite 787/1811
    origin: driver
