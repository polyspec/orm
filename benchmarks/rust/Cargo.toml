[package]
name = "polyspec-orm-bench"
version = "0.0.33"
edition = "2021"
rust-version = "1.99.0"
publish = false

[lints]
workspace = true

[workspace]

# The lints of make lint-rust (T391): every warning fails, and so does an error dropped by a must_use value (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"

[[bin]]
name = "native"
path = "src/native.rs"

[[bin]]
name = "driver_compare"
path = "src/driver_compare.rs"

[dependencies]
# The sqlx of the orm workspace (packages/rust/Cargo.toml), so the native baseline runs the driver that orm runs.
sqlx = { version = "0.9", git = "https://github.com/min-0-max/sqlx", tag = "v0.9.0-polyspec.2", features = ["runtime-tokio", "mysql", "chrono"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
polyspec-orm = { path = "../../packages/rust/orm" }
polyspec-orm-test-support = { path = "../../packages/rust/test-support" }

[profile.release]
opt-level = 3
debug = false

[dev-dependencies]
# The test case reports its start, result, elapsed time, and its own deadline.
polyspec-orm-testcase = { path = "../../packages/rust/testcase" }
