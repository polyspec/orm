# The gate pipeline of orm (kit K270, K910), which orm took from the example of kit and owns (T391). .github/workflows/ci.yml
# holds the triggers and the concurrency and calls it as a job (`uses: ./.github/workflows/ci-pipeline.yml`), so one push runs
# one workflow: the plan, shared, then the runtime jobs in parallel, then required. Each job runs one step, make ci-kit-<job>
# (T497), whose recipe installs only the locked prerequisites of the job, declared in config/ci.json, and runs the gate of its
# group with the targets that config/ci.json declares for that group (targets.shared, targets.runtimes.<runtime>) through make
# ci-targets. The job plan writes the plan of kit, which the uses: steps of the other jobs read.
name: ci-pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-26.04-arm
    outputs:
      runtimes: ${{ steps.plan.outputs.runtimes }}
      has_runtimes: ${{ steps.plan.outputs.has_runtimes }}
      shared_php: ${{ steps.plan.outputs.shared_php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - id: plan
        run: make ci-kit-plan

  shared:
    needs: plan
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/kit-bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ needs.plan.outputs.shared_php == 'true' }}
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      - run: make ci-kit-shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  runtime:
    needs: [plan, shared]
    if: ${{ needs.plan.outputs.has_runtimes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runtimes) }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.runtime == 'php' || matrix.runtime == 'php-ext' }}
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-kit-runtime RUNTIME=${{ matrix.runtime }}
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-runtime-${{ matrix.runtime }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The judgement of the pipeline: it fails when a job did not succeed. A runtime job that the plan did not select is skipped,
  # which it accepts; a failed plan or shared job fails it.
  required:
    if: ${{ always() }}
    needs: [plan, shared, runtime]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/kit-bootstrap
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-kit-required
