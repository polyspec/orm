# The CI pipeline of kit in a repository that adopts it (K270, K910). kit-sync copies this file from the installed package
# @polyspec/kit to .github/workflows/ci-pipeline.yml, and kit-check fails when the checkout differs from it; a repository never
# edits it. The repository's own .github/workflows/ci.yml holds the triggers and the concurrency and calls it as a job
# (`uses: ./.github/workflows/ci-pipeline.yml`), so one push runs one workflow: shared first, then the parity and runtime jobs in
# parallel, then required. Each job installs only its own locked prerequisites, declared in config/ci.json or selected from the
# repository's deps-<runtime> targets (K859), and runs kit's gate of its group with the targets that config/ci.json declares for
# that group (targets.shared, targets.parity, targets.runtimes.<runtime>) through make ci-targets, inside its context window.
name: ci-pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The shared job writes the plan that names the runner of the other jobs (config/ci.json runner), so it runs on the default runner.
  shared:
    runs-on: ubuntu-24.04
    outputs:
      runtimes: ${{ steps.plan.outputs.runtimes }}
      runner: ${{ steps.plan.outputs.runner }}
      parity_mode: ${{ steps.plan.outputs.parity_mode }}
      parity_matrix: ${{ steps.plan.outputs.parity_matrix }}
      has_runtimes: ${{ steps.plan.outputs.has_runtimes }}
      parity_tools: ${{ steps.plan.outputs.parity_tools }}
      parity_targets: ${{ steps.plan.outputs.parity_targets }}
      extractors: ${{ steps.plan.outputs.extractors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      - id: plan
        run: make kit-ci-plan
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(steps.plan.outputs.common_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: install common gate tools
        if: ${{ steps.plan.outputs.common_tools != '[]' }}
        run: make install-tools TOOLS="${{ join(fromJSON(steps.plan.outputs.common_tools), ' ') }}"
      - name: install PHP symbol extractor
        if: ${{ contains(steps.plan.outputs.extractors, 'php') }}
        run: make kit-install-symbols EXTRACTORS=php
      - name: install shared prerequisites
        run: make kit-ci-setup GROUP=shared
      - id: context_prepare
        name: prepare shared CI context
        run: make kit-ci-context-prepare GROUP=shared
      - name: shared gates
        run: make ci-targets TARGETS="kit-gates-static ${{ join(fromJSON(steps.plan.outputs.shared_targets), ' ') }}"
      - name: cleanup shared CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  parity:
    needs: shared
    if: ${{ needs.shared.outputs.parity_mode == 'full' }}
    runs-on: ${{ needs.shared.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(needs.shared.outputs.parity_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      - name: install parity toolchains
        if: ${{ needs.shared.outputs.parity_tools != '[]' }}
        run: make install-tools TOOLS="${{ join(fromJSON(needs.shared.outputs.parity_tools), ' ') }}"
      - name: install symbol extractors
        if: ${{ needs.shared.outputs.extractors != '[]' }}
        run: make kit-install-symbols EXTRACTORS="${{ join(fromJSON(needs.shared.outputs.extractors), ' ') }}"
      - name: install parity prerequisites
        run: make kit-ci-setup GROUP=parity
      - id: context_prepare
        name: prepare parity CI context
        run: make kit-ci-context-prepare GROUP=parity
      - name: parity gate
        run: make ci-targets TARGETS="kit-gates-parity ${{ join(fromJSON(needs.shared.outputs.parity_targets), ' ') }}"
      - name: cleanup parity CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=parity
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-parity
          path: var/report/ci-targets/
          if-no-files-found: ignore

  parity-api:
    needs: shared
    if: ${{ needs.shared.outputs.parity_mode == 'phases' }}
    runs-on: ${{ needs.shared.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(needs.shared.outputs.parity_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      - name: install parity toolchains
        if: ${{ needs.shared.outputs.parity_tools != '[]' }}
        run: make install-tools TOOLS="${{ join(fromJSON(needs.shared.outputs.parity_tools), ' ') }}"
      - name: install symbol extractors
        if: ${{ needs.shared.outputs.extractors != '[]' }}
        run: make kit-install-symbols EXTRACTORS="${{ join(fromJSON(needs.shared.outputs.extractors), ' ') }}"
      - name: install parity prerequisites
        run: make kit-ci-setup GROUP=parity
      - id: context_prepare
        name: prepare parity CI context
        run: make kit-ci-context-prepare GROUP=parity
      - name: API phase
        run: make ci-targets TARGETS="parity-api-check ${{ join(fromJSON(needs.shared.outputs.parity_targets), ' ') }}"
      - name: cleanup parity CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=parity
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-parity-api
          path: var/report/ci-targets/
          if-no-files-found: ignore

  parity-bindings:
    needs: shared
    if: ${{ needs.shared.outputs.parity_mode == 'phases' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shared.outputs.parity_matrix) }}
    runs-on: ${{ needs.shared.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(needs.shared.outputs.parity_tools, 'php') }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      - name: install parity toolchains
        if: ${{ needs.shared.outputs.parity_tools != '[]' }}
        run: make install-tools TOOLS="${{ join(fromJSON(needs.shared.outputs.parity_tools), ' ') }}"
      - name: install symbol extractors
        if: ${{ needs.shared.outputs.extractors != '[]' }}
        run: make kit-install-symbols EXTRACTORS="${{ join(fromJSON(needs.shared.outputs.extractors), ' ') }}"
      - name: install parity prerequisites
        run: make kit-ci-setup GROUP=parity
      - id: context_prepare
        name: prepare parity CI context
        run: make kit-ci-context-prepare GROUP=parity
      - name: binding phase
        run: make ci-targets TARGETS="parity-bindings-${{ matrix.implementation }}-check"
      - name: cleanup parity CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=parity
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-parity-bindings-${{ matrix.implementation }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  runtime:
    needs: shared
    if: ${{ needs.shared.outputs.has_runtimes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shared.outputs.runtimes) }}
    runs-on: ${{ needs.shared.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.runtime == 'php' || matrix.runtime == 'php-ext' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      - name: install runtime tools
        if: ${{ join(matrix.installTools, ' ') != '' }}
        run: make install-tools TOOLS="${{ join(matrix.installTools, ' ') }}"
      - name: install runtime prerequisites
        run: make kit-ci-setup GROUP=runtime RUNTIME=${{ matrix.runtime }}
      - name: install PHP symbol extractor
        if: ${{ matrix.runtime == 'php' && contains(needs.shared.outputs.extractors, 'php') }}
        run: make kit-install-symbols EXTRACTORS=php
      - id: context_prepare
        name: prepare runtime CI context
        run: make kit-ci-context-prepare GROUP=runtime RUNTIME=${{ matrix.runtime }}
      - name: runtime gate
        run: make ci-targets TARGETS="kit-gates-runtime-${{ matrix.runtime }} ${{ join(matrix.targets, ' ') }}"
      - name: cleanup runtime CI context
        if: ${{ always() && steps.context_prepare.outcome != 'skipped' }}
        run: make kit-ci-context-cleanup GROUP=runtime RUNTIME=${{ matrix.runtime }}
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-runtime-${{ matrix.runtime }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The closing common part: it fails when a job of the pipeline failed or was cancelled. A job is skipped only when the parity
  # mode excludes it, when the repository has no runtime, or when shared failed, which is a failure itself. It runs on the
  # default runner, since the runner output of shared is empty when shared fails before the plan.
  required:
    if: ${{ always() }}
    needs: [shared, parity, parity-api, parity-bindings, runtime]
    runs-on: ubuntu-24.04
    steps:
      - name: require every job of the pipeline
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *' failure '*|*' cancelled '*) exit 1 ;; esac
