# Release workflow of a repository that adopts kit. kit-sync copies this file from the installed package @polyspec/kit to
# .github/workflows/release.yml, and kit-check fails when the checkout differs from it; a repository never edits it.
#
# A dispatch of the workflow with the id of a successful CI run releases the commit of that run (K911): it tags the commit with
# the version of the newest section ## X.Y.Z of its change log (K924) and creates the GitHub Release of the tag as a draft with
# its archives, and makes it public. The run is the evidence; the release runs no test again. The steps run in order and stop at
# the first failure; each step runs one make target of kit with TAG, vX.Y.Z, from the environment, which release-tag writes:
#   bootstrap package installs the locked kit with the npm that devEngines.packageManager names for consumers, without scripts
#   install-tools TOOLS=npm installs the mise, the node and the npm of mise.toml with the copied installer of scripts/kit/bootstrap
#   install-packages installs package-lock.json with that npm, @polyspec/kit included, whose kit.mk has the targets below
#   release-tag      with the kit of main: requires a completed successful push or dispatch run RUN of ci.yml on main whose
#                    commit is on origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated
#                    tag vX.Y.Z and the tag of every Go module at that commit, or passes for a tag there already (K269), and
#                    appends TAG and VERSION to GITHUB_ENV; a tag pushed with the token of the run starts no run
#   checkout of the tag, then the bootstrap, npm and the packages of the tagged commit again
#   release-prepare  the preparation that the release of the repository declares with release-prepare:: (none by default)
#   release-tools    installs the tools that config/release.json needs for the packages of this repository; a make entry adds none
#   release-tools-path puts var/tools/bin on the PATH of the steps that follow, through GITHUB_PATH
#   release-assets  builds the archive of every package, and packages.json of the Composer packages, into var/release/assets
#   release-publish creates the GitHub Release of the tag as a draft, with its notes and those files
#   release-undraft makes the release public
# A failed step leaves the release a draft and fails the run.
name: release

on:
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run of main whose commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RUN: ${{ inputs.run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: main with the whole history and every branch, so origin/main is there for the ancestry check and
      # the kit of main runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: verify the Composer archive tool
        run: command -v zip >/dev/null || { echo 'Info-ZIP is required for Composer release archives; install the zip package on the Ubuntu runner'; exit 1; }
      # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools
      # with mise (K171); the tools of @polyspec/kit then run the node of var/tools. The pinned npm of var/tools installs the
      # packages, so the cache of setup-node is off.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0: the PHP of .php-version for the Composer packages and the extension of the release. A
      # repository that needs PHP (a Composer package of config/release.json, or php of config/toolchain.json) declares
      # .php-version, which the kit-check of CI requires (K193); a repository without PHP has none and sets up no PHP. The
      # release runs no kit-check of its own: release-tag refuses a commit whose CI run, kit-check included, did not pass
      # (K755).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      # Consumers install their locked kit package before Make reads its bootstrap; kit runs its own sources.
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
            # devEngines runs outside the checkout with --prefix (K938-1).
            root="$PWD"
            version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
            (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts --allow-remote=root)
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      - name: tag the commit of the CI run
        run: make release-tag
      # The release builds the tagged commit with its own kit and packages.
      - name: check out the tag
        run: git checkout --quiet "$TAG"
      - name: bootstrap the installed kit package of the tag
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
            # devEngines runs outside the checkout with --prefix (K938-1).
            root="$PWD"
            version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
            (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts --allow-remote=root)
          fi
      - name: install npm of the tag
        run: make install-tools TOOLS=npm
      - name: install packages of the tag
        run: make install-packages
      - name: prepare the release of the repository
        run: make release-prepare
      - name: make release-tools
        run: make release-tools
      # The tools of var/tools/bin — the Go of mise.toml that the release builds with, and whatever else the packages
      # need — join PATH for the steps that follow; a step's PATH is its own, so the export goes to the file the
      # runner reads between steps.
      - name: put the installed tools on PATH
        run: make release-tools-path
      - name: build the assets
        run: make release-assets
      - name: create the draft release
        run: make release-publish
      - name: make the release public
        run: make release-undraft TAG="$TAG"
