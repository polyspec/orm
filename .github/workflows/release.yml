# Release workflow of a repository that adopts kit. kit-sync copies this file from the installed package @polyspec/kit to
# .github/workflows/release.yml, and kit-check fails when the checkout differs from it; a repository never edits it.
#
# A dispatch of the workflow with a tag, or a push of the tag, creates the GitHub Release of the tag as a draft, proves the draft from outside the checkout, and makes it public
# only after the proof passes. The steps run in order and stop at the first failure; each step runs one make target of
# kit with TAG from the environment. The first two install the package in the bootstrap order of a repository:
#   release-tag      on a dispatch, creates the annotated tag at origin/main and pushes it, or passes when it is there
#                    (K269); a tag pushed with the token of the run starts no second run
#   bootstrap package installs the locked kit with the exact packageManager npm for consumers, without scripts
#   install-tools TOOLS=npm installs the npm of packageManager with the copied installer of scripts/kit/bootstrap
#   install-packages installs package-lock.json with that npm, @polyspec/kit included, whose kit.mk has the targets below
#   release-prepare  the preparation that the release of the repository declares with release-prepare:: (none by default)
#   release-tools    installs the tools that config/release.json needs for the packages and proof of this repository
#   release-tools-path puts var/tools/bin on the PATH of the steps that follow, through GITHUB_PATH
#   release-verify   the tagged commit is on origin/main and its check runs concluded success, without running the tests again
#   release-versions every manifest has the version of the tag and the changelog has its section
#   release-assets  builds the archive of every package into var/release/assets
#   release-publish creates the GitHub Release of the tag as a draft, with its notes and archives
#   release-proof   proves the draft: its assets, its consumer installs, its git-tag installs and its Go module tags
#   release-undraft makes the release public; it runs only after release-proof passed
# A failed step leaves the release a draft and fails the run, so a release that cannot be installed is never public.
name: release

on:
  push:
    tags: ['v*', '**/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release, such as v0.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: the whole history and every branch, so origin/main is there for the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: verify the Composer archive tool
        run: command -v zip >/dev/null || { echo 'Info-ZIP is required for Composer release archives; install the zip package on the Ubuntu runner'; exit 1; }
      # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools
      # with mise (K171); the tools of @polyspec/kit then run the node of var/tools. The pinned npm of var/tools installs the
      # packages, so the cache of setup-node is off.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0: the PHP of .php-version runs the Composer proof of the release. A repository that needs
      # PHP (a Composer package or consumer of config/release.json, or php of config/toolchain.json) declares .php-version,
      # which make kit-check below requires (K193); a repository without PHP has none and sets up no PHP.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      # Consumers install their locked kit package before Make reads its bootstrap; kit runs its own sources.
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      # The configuration of the repository against the installed kit, before any release step: a repository that needs PHP
      # and declares no .php-version stops here instead of releasing with the PHP of the runner (K193).
      - name: check the configuration
        run: make kit-check
      - name: tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: make release-tag
      - name: prepare the release of the repository
        run: make release-prepare
      - name: make release-tools
        run: make release-tools
      # The tools of var/tools/bin — the Go of the kit pin (toolchain-pins.json) that the release builds with, and whatever else the packages
      # need — join PATH for the steps that follow; a step's PATH is its own, so the export goes to the file the
      # runner reads between steps.
      - name: put the installed tools on PATH
        run: make release-tools-path
      - name: verify the tagged commit
        run: make release-verify
      - name: check the versions
        run: make release-versions
      - name: build the assets
        run: make release-assets
      - name: create the draft release
        run: make release-publish
      - name: prove the draft release
        run: make release-proof TAG="$TAG"
      - name: make the release public
        run: make release-undraft TAG="$TAG"
