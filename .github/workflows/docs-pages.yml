name: docs-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run of the push before it on the same ref: the runners are few, and only the run of the
# newest head counts. make repo-check requires this on every workflow that runs on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site of main: build builds docs/.vitepress/dist and uploads it as the Pages artifact, and deploy publishes it.
  # The documentation checks of the site run in the job docs of ci.yml on every pull request and merge group.
  build:
    runs-on: ubuntu-26.04-arm
    env:
      VITEPRESS_BASE: /orm/
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: mise.toml
          cache: npm
      # Bootstrap the declared npm and package lock with the runner's Node;
      # Make can read its Kit include only after this installs @polyspec/kit.
      - name: bootstrap the installed kit package
        id: kit-bootstrap
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
            # devEngines runs outside the checkout with --prefix (K938-1).
            root="$PWD"
            version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
            (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set; run this step in a workflow of GitHub Actions, whose runner sets it}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts --allow-remote=root)
          fi
      - name: npm of devEngines
        id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: install Node dependencies
        id: node-modules
        if: ${{ !cancelled() }}
        run: make install-packages
      - name: build the site
        id: build
        if: ${{ !cancelled() }}
        run: make docs-build
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.build.outcome == 'success' }}
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@v4
