name: docs-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run of the push before it on the same ref: the runners are few, and only the run of the
# newest head counts. make repo-check requires this on every workflow that runs on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site of main: site builds docs/.vitepress/dist with make ci-site (T497) and uploads it as the Pages artifact, and
  # deploy publishes it. The documentation checks of the site run in the job docs of ci.yml.
  site:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
      # The bootstrap of kit (K992): .github/actions/kit-bootstrap installs the locked kit package and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-site
      # A failed build ends the job before this step, so only a built site is uploaded.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # The deploy carries the artifact of site to Pages; it runs no recipe of its own.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@v4
