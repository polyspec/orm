name: docs-pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    env:
      VITEPRESS_BASE: /orm/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The job publishes docs/.vitepress/dist: the build step writes it, the
      # idempotence check builds it twice more and compares every byte, and the
      # smoke test serves it and opens it in a browser before the upload.
      - name: Build the static site
        run: make docs-build
      - name: Build twice and compare every static file
        run: make docs-verify-idempotent
      - name: Smoke test of the built site in a browser
        run: make docs-static-check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@v4
