name: docs-pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    env:
      VITEPRESS_BASE: /orm/
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 10
      - uses: actions/setup-node@v7
        timeout-minutes: 10
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        timeout-minutes: 15
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 20
      - name: Build twice and compare every static file
        timeout-minutes: 20
        run: make docs-verify-idempotent
      - name: Check static routes, links, diagrams and browser behavior
        timeout-minutes: 15
        run: make docs-static-check
      - uses: actions/upload-pages-artifact@v3
        timeout-minutes: 10
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        timeout-minutes: 10
        id: deployment
        uses: actions/deploy-pages@v4
