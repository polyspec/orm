# The assets of each platform of the bindings (binding GN-19a, GN-19i). The workflow ci calls it for the commit of its run, and
# the workflow release calls it for the tree of the tag that it releases; every job runs the release check of binding before it
# builds (make release-binding-check, GN-19g, B2.457). Every recipe that builds an asset is in packages/release.mk,
# which binding release-recipes writes and Git ignores.
#
# The job platform runs on the runner of its platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, the one exception to the
# runner of .github/runner (runnerErrors of scripts/repo/ci.mts): the asset of a platform is linked and loaded only on that
# platform, because no tool of the release compiles for another platform. Each job runs one step, make ci-assets-<job>
# (T497): the job platform builds the static library of the Go module, the abi3 wheel, the PHP extension for
# each PHP minor of phpExtension.minors of config/toolchain.json, which its setup-php steps install before the run step, and
# the npm platform package of its platform; the job npm builds the npm package itself with the wasm-bindgen of mise.toml.
# Each build runs also after a failed one, so one run names every asset that does not build. Each uploads var/release/assets
# as an artifact, which the workflow release downloads. No step or job has timeout-minutes.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # The whole history, whose commit time release-wheel reads to date the files of the wheel.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      # Each PHP minor of phpExtension.minors of config/toolchain.json with its php-config, which the build of the extension
      # reads; make ci-assets-php-ext MINOR=<minor> builds with the PHP of that minor (extensionMinorErrors of
      # scripts/repo/toolchains.mts). The build runs no Composer, so setup-php installs no tool.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:2.10.3
          coverage: none
      # KyleMayes/install-llvm-action v2.0.9: the LLVM of config/toolchain.json (llvm.version), whose libclang and clang the
      # bindgen of ext-php-rs reads (binding GN-19i). The ubuntu-26.04 images hold LLVM 20, 21 and 22 at /usr/lib/llvm-<major>;
      # the macos-15 image does not hold LLVM 21, so the step installs it there and sets LLVM_PATH, which make
      # ci-assets-php-ext passes as LLVM_ROOT.
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        if: runner.os == 'macOS'
        with:
          version: '21.1.8'
          directory: ${{ runner.temp }}/llvm
      - run: make ci-assets-platform
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-assets-npm
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
