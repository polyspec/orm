# The gates of kit in a repository that adopts it (K270). kit-sync copies this file from the installed package @polyspec/kit to
# .github/workflows/gates.yml, and kit-check fails when the checkout differs from it; a repository never edits it.
#
# It installs the repository from its locked packages, then runs make -k kit-gates: every check that a rule of PRINCIPLES.md is
# enforced by, each a target of kit.mk, so one run shows every failure. A repository runs its own tests in a workflow of its own.
name: gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1; commits-check reads the commits of the run, so the checkout carries the full commit graph. The project
      # is at the workspace root; installed packages provide the shared tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, for a repository that declares one (K193).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - name: bootstrap the installed kit package
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: install npm
        run: make install-tools TOOLS=npm
      - name: install packages
        run: make install-packages
      - name: install
        run: make install
      # cargo of the Rust pin, for a repository that declares rust-toolchain.toml.
      - name: install rust
        if: ${{ hashFiles('rust-toolchain.toml') != '' }}
        run: rustup toolchain install
      - name: commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then echo "range=$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then echo "range=$BEFORE..$GITHUB_SHA"
          else echo "range=HEAD"
          fi >> "$GITHUB_ENV"
      # Native development declarations may link local packages; release installs need no sibling checkout.
      - name: link
        run: make link
      - name: gates
        run: make -k kit-gates RANGE="$range"
