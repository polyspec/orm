name: push-gate

on:
  push:
    branches: ['**']

permissions:
  contents: read

# A new push cancels the run of the push before it on the same ref: the runners are few, and only the run of the
# newest head counts. make repo-check requires this on every workflow that runs on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-gate:
    runs-on: ubuntu-26.04-arm
    # The push gate of the pre-push hook, run again on the commit of the event: the pushed commit (github.sha). A push
    # that bypassed the hook (git push --no-verify,
    # or a checkout without core.hooksPath) fails here when its checklist has an item in progress or its commit does
    # not track the hook as an executable file. The check push-gate is the job ID. The actions are pinned to the
    # commits of their tags.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: mise.toml
      # Bootstrap the declared npm and package lock with the runner's Node;
      # Make can read its Kit include only after this installs @polyspec/kit.
      - name: bootstrap the installed kit package
        id: kit-bootstrap
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            npm_config_cache="$PWD/var/bootstrap/npm-cache" npm exec --yes --package="$(node -p 'require("./package.json").packageManager.split("+")[0]')" -- npm ci --ignore-scripts --allow-remote=root
          fi
      - name: npm of packageManager
        id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: install Node dependencies
        id: node-modules
        if: ${{ !cancelled() }}
        run: make install-packages
      - name: push gate
        id: gate
        if: ${{ !cancelled() }}
        run: make push-gate-commit COMMIT=${{ github.sha }}
