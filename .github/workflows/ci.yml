# CI (docs/checklist.md T5.8): engine, the three clients, conformance and codec vectors against
# MySQL, PostgreSQL and SQLite, the fragment analyzer, token parity and the hot-path gate.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maxkwon
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: orm_bench
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maxkwon"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: orm_bench
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ORM_MYSQL_DSN_GO: "root@tcp(127.0.0.1:3306)/orm_bench?parseTime=true&clientFoundRows=true"
      ORM_MYSQL_DSN_PHP: "mysql:host=127.0.0.1;port=3306;dbname=orm_bench;charset=utf8mb4"
      ORM_MYSQL_URL_RUST: "mysql://root@127.0.0.1:3306/orm_bench"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.27" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: install Node dependencies
        run: |
          npm ci
          npm ci --prefix clients/typescript
      - uses: dtolnay/rust-toolchain@stable
      # sqlx and wasmtime are most of the build; without this the job spends ~6 of its 9 minutes compiling them again
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/rust -> target
            tests/interfaces/rust -> target
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, apcu, msgpack
          ini-values: apc.enable_cli=1
      - name: install PHP dependencies
        run: composer install --working-dir=clients/php --no-interaction --no-progress --prefer-dist
      - name: load bench schema (mysql, postgres, sqlite)
        run: |
          mysql -h 127.0.0.1 -uroot orm_bench < bench/sql/battle.sql
          sudo apt-get install -y -q postgresql-client sqlite3 >/dev/null
          psql -h 127.0.0.1 -U maxkwon orm_bench -q -f bench/sql/battle.pg.sql
          psql -h 127.0.0.1 -U maxkwon orm_bench -q -f bench/sql/seed.pg.sql
          sqlite3 /tmp/orm_bench.sqlite < bench/sql/battle.sqlite.sql
          sqlite3 /tmp/orm_bench.sqlite < bench/sql/seed.sqlite.sql
          go run ./bench/seedaes -driver postgres -dsn 'postgres://maxkwon@127.0.0.1:5432/orm_bench?sslmode=disable'
          go run ./bench/seedaes -driver sqlite -dsn 'file:/tmp/orm_bench.sqlite'
      - name: engine
        run: go test ./engine/... ./contracts ./tests/interfaces/check && go vet ./...
      - name: complete Go test suite
        run: go test ./...
      - name: typescript common structure
        run: npm run typescript:check && npm run typescript:build && node tests/typescript/check.mjs && node tests/typescript/common-vector.mjs && node tests/typescript/compiler-bridge.mjs && node tests/typescript/codec-vector.mjs
      - name: schema AES version rule
        run: npm run schema:check
      - name: protobuf compiler wire check
        run: make proto-check
      - name: artifacts
        run: |
          mkdir -p bin
          go build -o bin/ormd ./cmd/ormd
          GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o bin/ormengine.wasm ./engine/wasm
      - name: generated clients are current
        run: |
          for l in go php rust; do go run ./cmd/ormgen gen --schema schema/schema.json --lang $l --out clients/$l/gen; done
          git diff --exit-code -- clients/go/gen clients/php/gen clients/rust/gen
      - name: go client
        run: go test ./clients/go/...
      - name: common interfaces and native structure
        run: go run ./tests/interfaces/check --self-test
      - name: hot-path regression gate
        run: ORM_RUN_PERF_GATE=1 go test ./bench/go -run TestHotPathGate -count=1 -v
      - name: rust client
        run: cd clients/rust && cargo build --release && cargo test --release -p orm && ./target/release/integration ../../bin/ormengine.wasm ../../schema/schema.json
      - name: rust 150-table generation
        run: make rust-150-check
      - name: php client
        run: |
          bin/ormd -socket "$PWD/bin/ormd.sock" -schema schema/schema.json 2>bin/ormd.log &
          until grep -q "listening on" bin/ormd.log; do sleep 0.2; done   # CI-only wait on the daemon's own ready line
          php clients/php/tests/integration.php "$PWD/bin/ormd.sock" "$PWD/schema/schema.json"
          php clients/php/tests/compat.php "$PWD/bin/ormd.sock" "$PWD/schema/schema.json"
      - name: conformance (3 languages identical)
        run: go run ./tests/conformance/check run
      - name: conformance on postgres and sqlite (3 languages; results identical to MySQL, statements per dialect)
        run: |
          go run ./tests/conformance/check run -driver postgres -langs go -dsn 'postgres://maxkwon@127.0.0.1:5432/orm_bench?sslmode=disable'
          go run ./tests/conformance/check run -driver postgres -langs php -dsn 'pgsql:host=127.0.0.1;port=5432;dbname=orm_bench;user=maxkwon'
          go run ./tests/conformance/check run -driver sqlite -langs go -dsn 'file:/tmp/orm_bench.sqlite?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)'
          go run ./tests/conformance/check run -driver sqlite -langs php -dsn '/tmp/orm_bench.sqlite'
          go run ./tests/conformance/check run -driver postgres -langs rust -dsn 'postgres://maxkwon@127.0.0.1:5432/orm_bench'
          go run ./tests/conformance/check run -driver sqlite -langs rust -dsn 'sqlite:///tmp/orm_bench.sqlite'
          go run ./tests/conformance/check compare -driver postgres tests/conformance/out/postgres/go.json tests/conformance/out/postgres/php.json tests/conformance/out/postgres/rust.json
          go run ./tests/conformance/check compare -driver sqlite tests/conformance/out/sqlite/go.json tests/conformance/out/sqlite/php.json tests/conformance/out/sqlite/rust.json
      - name: common state and execution contracts
        run: |
          go run ./tests/interfaces/check --results tests/conformance/out
          go run ./tests/interfaces/check --results tests/conformance/out/postgres
          go run ./tests/interfaces/check --results tests/conformance/out/sqlite
      - name: go integration on postgres and sqlite
        run: |
          ORM_TEST_DRIVER=postgres ORM_TEST_DSN='postgres://maxkwon@127.0.0.1:5432/orm_bench?sslmode=disable' go test ./clients/go/gen/
          ORM_TEST_DRIVER=sqlite ORM_TEST_DSN='file:/tmp/orm_bench.sqlite?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)' go test ./clients/go/gen/
      - name: codec vectors
        run: |
          go test ./clients/go/orm -run TestCodec
          (cd clients/rust && cargo test --release -p orm codec)
          php tests/codec/check.php
      - name: fragment analyzer (go)
        run: go run ./cmd/ormgen check --lang go --schema schema/schema.json clients/go tests/conformance examples bench
      - name: token parity
        run: |
          # the conformance runners are the parity contract; integration tests may differ in coverage per language
          go run ./cmd/ormgen tokens --schema schema/schema.json tests/conformance/runner_go/main.go tests/conformance/runner.php clients/rust/tests/src/conformance.rs
      - name: physical migration recovery
        env:
          ORM_MIGRATION_MYSQL_DSN: root@tcp(127.0.0.1:3306)/orm_bench?parseTime=true
          ORM_MIGRATION_POSTGRES_DSN: postgres://maxkwon@127.0.0.1:5432/orm_bench?sslmode=disable
        run: CI=true ./scripts/db-test.sh
