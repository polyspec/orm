# CI: every check of the repository. The job test runs make orm-check, the targets
# of the local checks, against MySQL, PostgreSQL, and SQLite, with the common
# interfaces and the hot-path regression check of the feature verification, the decoder
# fuzz checks and the common state contracts of the conformance results, split
# into the CI groups of the Makefile (CI_GROUPS): one job per group, all at
# once, each running make check-run GROUP=<group> on the targets CI_TARGETS_<group>;
# the groups together run every target of CHECK_TARGETS once. The job docs runs
# the documentation checks of the published site, and the last job ci-passed,
# the run whose id the release takes (make release-tag requires its success), passes
# only when every other job succeeded. This is where the full suite
# runs: on every push to main and on a manual run, never stopping at a failure, and
# recording enough to fix every failure before the next run. A check it lacks
# belongs in a target of CHECK_TARGETS, and make repo-check fails a step after
# make orm-check other than the summary and the report upload, and a group set that
# omits or repeats a target of CHECK_TARGETS.
# make orm-test-servers starts the database servers and writes their DSNs, as it
# does for the local checks. No step or job has timeout-minutes: every step
# (a checkout, an install, a server start, a tool run or a whole suite) is a
# long operation, which the runner logs line by line and judges by its exit
# code, with no deadline; only a test case inside a suite has its own
# deadline. make repo-check fails a workflow with timeout-minutes.
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

# A new run cancels the run before it on the same ref: the runners are few, and only the run of the newest head
# counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates of kit (kit S12): ci-pipeline.yml, which kit-sync copies, plans and runs the shared, parity and runtime
  # gates. No job waits for it but ci-passed, which needs it: every other job installs what it runs itself.
  kit:
    uses: ./.github/workflows/ci-pipeline.yml
    permissions:
      contents: read

  test:
    # .github/runner declares the runner of every job; make repo-check
    # requires it.
    runs-on: ubuntu-26.04-arm
    # One job per CI group of the Makefile (CI_GROUPS); make repo-check
    # requires that this list equals CI_GROUPS. A failed group does not cancel
    # the others: every group runs to its end.
    strategy:
      fail-fast: false
      matrix:
        group: [static, clients_db, performance, client_db_go, client_db_php, client_db_php_extension, client_db_typescript, client_db_python, client_db_rust, clients_pooler, conformance, dbspec, dbspec_apply, dbspec_go, dbspec_php, dbspec_php_extension, dbspec_typescript, dbspec_python, dbspec_rust, feature_go_mysql, feature_go_postgres, feature_go_sqlite, feature_php_mysql, feature_php_postgres, feature_php_sqlite, feature_php_extension_mysql, feature_php_extension_postgres, feature_php_extension_sqlite, feature_typescript_mysql, feature_typescript_postgres, feature_typescript_sqlite, feature_python_mysql, feature_python_postgres, feature_python_sqlite, feature_rust_mysql, feature_rust_postgres, feature_rust_sqlite, markdown_go, markdown_php, markdown_php_extension, markdown_typescript, markdown_python, markdown_rust, feature_performance, feature_verify_rust, feature_verify_other, feature_helpers, stress_mysql, stress_pg_sqlite, python]
    # Every setup step has an id that scripts/check/ci-setup.mts maps to what it
    # installs, and runs whatever the earlier steps did (if: !cancelled()), so
    # one failed install never hides another. The step group-needs writes the
    # needs of the targets of the group (contracts/check-inputs.json) as step
    # outputs, and a setup step runs only when the group needs what it
    # installs; make repo-check requires the condition of each step that
    # scripts/check/ci-setup.mts declares. make orm-check runs after all of them
    # and reads their results (ORM_CI_SETUP): a target that needs what a
    # failed or skipped step installs is recorded as not-run with that step,
    # and every other target runs. A failed step fails the job. The checkout
    # and Node are what the runner itself needs.
    steps:
      # The kit tools read the commit graph, so the checkout carries the full
      # commit graph.
      - uses: actions/checkout@v5
        id: checkout
        with:
          fetch-depth: 0
      # mise.toml declares the one Node release of the checks, locally and
      # here; make repo-check requires it. make ts-min-check runs the
      # TypeScript client on the lowest release of package.json engines.node.
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: mise.toml
          cache: npm
      # Bootstrap the declared npm and package lock with the runner's Node;
      # Make can read its Kit include only after this installs @polyspec/kit.
      - name: bootstrap the installed kit package
        id: kit-bootstrap
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
            # devEngines runs outside the checkout with --prefix (K938-1).
            root="$PWD"
            version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
            (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set; run this step in a workflow of GitHub Actions, whose runner sets it}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts --allow-remote=root)
          fi
      - name: npm of devEngines
        id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: setup of the CI group
        id: group-needs
        if: ${{ !cancelled() }}
        run: make --no-print-directory ci-group-needs GROUP=${{ matrix.group }} >> "$GITHUB_OUTPUT"
      - name: TypeScript of the interface extractor
        id: interfaces-typescript
        if: ${{ !cancelled() && steps.group-needs.outputs.interfaces-typescript == 'true' }}
        run: make orm-install-interfaces-typescript
      # make install-tools checks for the PHP version declared by the checkout before installing its other tools.
      - uses: shivammathur/setup-php@v2
        id: php-bootstrap
        if: ${{ !cancelled() && steps.group-needs.outputs.php == 'true' }}
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      # Toolchain-check (static) uses the full declared tool inventory. Other groups install only the selected Go runner
      # and the runtimes their declared needs use; parity extractors are installed separately below.
      - name: tools of mise.toml
        id: go
        if: ${{ !cancelled() }}
        env:
          CI_GROUP_PHP: ${{ steps.group-needs.outputs.php }}
          CI_GROUP_PYTHON: ${{ steps.group-needs.outputs.python }}
        run: make ci-install-tools GROUP=${{ matrix.group }}
      # check-run builds the Go lease runner in every group; it needs only x/sys
      # from the Go workspace. Runtime groups that declare Go work also install
      # the full module set and generated models below.
      - name: Go module of the check runner
        id: go-lease-modules
        if: ${{ !cancelled() }}
        run: make orm-install-go-lease
      - name: Go modules
        id: go-modules
        if: ${{ !cancelled() && steps.group-needs.outputs.go == 'true' }}
        run: make orm-install-go
      - name: API parity symbol extractors
        id: parity-symbols
        if: ${{ !cancelled() && steps.group-needs.outputs.parity-symbols == 'true' }}
        run: make kit-install-symbols EXTRACTORS="go php"
      # The markdown-conformance-check/<runtime> groups run each native client
      # on the flowmark build that tests/markdown/flowmark.version pins;
      # make orm-install-flowmark installs it.
      - name: flowmark build of tests/markdown/flowmark.version
        id: flowmark
        if: ${{ !cancelled() && steps.group-needs.outputs.flowmark == 'true' }}
        run: make orm-install-flowmark
      - name: Rust toolchain of rust-toolchain.toml
        id: rust
        if: ${{ !cancelled() && steps.group-needs.outputs.rust == 'true' }}
        # rustup installs the channel and components of rust-toolchain.toml.
        run: make orm-install-rust-toolchain
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        if: ${{ !cancelled() && steps.group-needs.outputs.rust == 'true' }}
        with:
          workspaces: |
            packages/rust -> target
            benchmarks/rust -> target
            packages/rust/testing/interfaces -> target
      # make orm-check runs cargo offline on the crates of every Cargo.lock that make orm-install-rust-crates downloads; it runs
      # after the cache is restored, since the restored registry replaces crates downloaded before it.
      - name: Rust crates
        id: rust-crates
        if: ${{ !cancelled() && steps.group-needs.outputs.rust == 'true' }}
        run: make orm-install-rust-crates
      # make orm-install-python builds the venv from the Python of mise.toml (the interpreter of make python-venv), so CI and a
      # local check use the same interpreter; setup-python is not used.
      - name: Python client dependencies
        id: orm-install-python
        if: ${{ !cancelled() && steps.group-needs.outputs.python == 'true' }}
        run: make orm-install-python
      - name: lowest PHP release of the PHP client
        # make php-min-check runs the PHP client unit tests on the lowest release
        # of require.php in packages/php/composer.json; setup-php installs it
        # first, and the PHP of .php-version after it becomes php on PATH.
        id: php-min
        if: ${{ !cancelled() && steps.group-needs.outputs.php == 'true' }}
        run: make --no-print-directory ci-php-min-version >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        id: php-min-release
        if: ${{ !cancelled() && steps.group-needs.outputs.php == 'true' }}
        with:
          php-version: ${{ steps.php-min.outputs.version }}
          extensions: pdo_sqlite, openssl
          # mise.toml declares the one Composer release of the checks (http:composer).
          tools: composer:2.10.3
          coverage: none
      # .php-version declares the PHP release of the checks, locally and here.
      - uses: shivammathur/setup-php@v2
        id: php
        if: ${{ !cancelled() && steps.group-needs.outputs.php == 'true' }}
        with:
          php-version-file: .php-version
          extensions: pdo_mysql, pdo_pgsql, pgsql, pdo_sqlite, openssl
          tools: composer:2.10.3
          # The checks run PHP without a debugger or coverage driver, as the local
          # PHP does; Xdebug changes the ratios of the hot-path gate.
          coverage: none
      - name: install PHP dependencies
        id: composer
        if: ${{ !cancelled() && steps.group-needs.outputs.php == 'true' }}
        run: make orm-install-php
      - name: tools of the PHP extension build
        id: php-extension-tools
        if: ${{ !cancelled() && steps.group-needs.outputs.php-extension-tools == 'true' }}
        # PHP-extension targets build polyspec_orm with phpize; this also installs
        # the pinned arginfo generator and parser through Kit's shared installer.
        run: make orm-install-php-extension-tools
      - name: programs of the database servers
        id: server-programs
        if: ${{ !cancelled() && steps.group-needs.outputs.server-programs == 'true' }}
        # scripts/ci/server-programs.mts installs the programs from which make
        # orm-test-servers starts the servers.
        run: make orm-install-server-programs
      - name: database servers
        # The MySQL and PostgreSQL primaries and replicas, ProxySQL and PgBouncer,
        # the databases orm_test, orm_tools and orm_bench, and the environment
        # file .runtime/servers/env that the database checks read. make orm-check
        # records the targets that need the servers as not-run with this failure
        # and runs every other target.
        id: servers
        if: ${{ !cancelled() && steps.group-needs.outputs.databases == 'true' }}
        run: make orm-test-servers
      - name: make orm-check
        # The targets CI_TARGETS_<group> of the group through the runner of the
        # local checks, with its own bench and decimal databases when a target
        # needs them; make repo-check fails when the groups omit or repeat a
        # target of CHECK_TARGETS, or this workflow runs one of them or a
        # verification command of the feature checks again. The run never
        # stops at a failure: every target runs unless a setup step it needs
        # failed, and the step fails when a target failed or did not run. The
        # report of the run is .runtime/check/ci_<run id>_<attempt>_<group>/report.
        if: ${{ !cancelled() }}
        env:
          ORM_CHECK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          ORM_CI_SETUP: ${{ toJSON(steps) }}
        run: make check-run GROUP=${{ matrix.group }}
      # The summary of the run, also of a runner that did not finish, as the job
      # summary and in the report, with the run record and the server logs; then
      # the report of this run id alone, so no file of an earlier run is
      # collected. make repo-check allows exactly these two steps after make
      # check.
      - name: summary
        if: ${{ !cancelled() }}
        env:
          ORM_CHECK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
        run: node scripts/check/summary.mts
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/check/ci_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.group }}/report/
          if-no-files-found: error

  docs:
    runs-on: ubuntu-26.04-arm
    env:
      VITEPRESS_BASE: /orm/
    # The documentation checks of the site that docs-pages.yml publishes, with
    # its base path. Every step has an id and runs whatever the earlier steps
    # did (if: !cancelled()); make docs-ci records a target whose setup step
    # failed as not-run, and the report is uploaded under !cancelled().
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: mise.toml
          cache: npm
      # Bootstrap the declared npm and package lock with the runner's Node;
      # Make can read its Kit include only after this installs @polyspec/kit.
      - name: bootstrap the installed kit package
        id: kit-bootstrap
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
            # devEngines runs outside the checkout with --prefix (K938-1).
            root="$PWD"
            version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
            (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set; run this step in a workflow of GitHub Actions, whose runner sets it}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts --allow-remote=root)
          fi
      - name: npm of devEngines
        id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      # docs-verify-idempotent builds docs/.vitepress/dist twice and compares
      # every byte, and docs-check builds it and reads its pages and links
      # with Node. make docs-ci runs the two through the runner of make orm-check,
      # also after a failed one, and writes the log of each and a summary to
      # the report of this run id, which the next step uploads whatever the
      # result.
      - name: documentation checks
        id: docs
        if: ${{ !cancelled() }}
        env:
          ORM_CHECK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-docs
          ORM_CI_SETUP: ${{ toJSON(steps) }}
        run: make docs-ci
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/check/ci_${{ github.run_id }}_${{ github.run_attempt }}_docs/report/
          if-no-files-found: error

  # The VS Code integration test of the dbspec extension: the editor fixtures through
  # vscode.provideDocumentSemanticTokens inside the VS Code that make orm-install-vscode installs (kit's installer, at the
  # minimum release of packages/dbspec-vscode). VS Code needs a display, so the test runs on a virtual X server.
  editor:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: mise.toml
          cache: npm
      - name: bootstrap the installed kit package
        id: kit-bootstrap
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
            # devEngines runs outside the checkout with --prefix (K938-1).
            root="$PWD"
            version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
            (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set; run this step in a workflow of GitHub Actions, whose runner sets it}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts --allow-remote=root)
          fi
      - name: npm of devEngines
        id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: tools of mise.toml
        id: go
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=go
      # dbspec-vscode-check builds the shared lease runner; it uses only x/sys from the Go client module.
      - name: Go lease module of the check runner
        id: go-lease-modules
        if: ${{ !cancelled() }}
        run: make orm-install-go-lease
      - name: VS Code of the integration test
        id: vscode
        if: ${{ !cancelled() }}
        run: make orm-install-vscode
      - name: VS Code integration test
        id: integration
        if: ${{ !cancelled() }}
        run: make ci-vscode-integration

  # The one check of this workflow that the ruleset of main requires: it runs
  # after every other job, also after a failed or cancelled one (if: always()),
  # and passes only when each job of needs succeeded, every CI group of test
  # included. make repo-check requires that it is the last job and that needs
  # lists every other job.
  ci-passed:
    if: ${{ always() }}
    needs: [kit, test, docs, editor]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
      - name: bootstrap the installed kit package
        id: kit-bootstrap
        if: ${{ !cancelled() }}
        run: |
          if [ "$(node -p 'require("./package.json").name')" != '@polyspec/kit' ]; then
            # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
            # devEngines runs outside the checkout with --prefix (K938-1).
            root="$PWD"
            version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
            (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set; run this step in a workflow of GitHub Actions, whose runner sets it}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts --allow-remote=root)
          fi
      - name: npm of devEngines
        id: npm
        if: ${{ !cancelled() }}
        run: make install-tools TOOLS=npm
      - name: every job passed
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed
