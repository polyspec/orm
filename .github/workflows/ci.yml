# CI: the planner, the four clients, conformance and codec vectors against
# MySQL, PostgreSQL, and SQLite, and the hot-path gate. make test-servers starts
# the database servers and writes their DSNs, as it does for the local checks.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # git-check reads history from the recorded subject-format baseline, so
      # the checkout must carry the full commit graph.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with: { go-version: "1.27" }
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - name: install Node dependencies
        run: |
          npm ci
          npm ci --prefix clients/typescript
          npx playwright install --with-deps chromium
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/rust -> target
            bench/rust -> target
            tests/interfaces/rust -> target
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, openssl
      - name: SQLite 3.46+ for PHP
        # PHP links the system SQLite (3.45 on Ubuntu 24.04); every client
        # requires 3.46, so a newer library in /usr/local/lib takes its place.
        # pdo_sqlite needs the column metadata functions the system build has.
        run: |
          curl -fsSL https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz | tar -xz -C /tmp
          (cd /tmp/sqlite-autoconf-3460100 && CFLAGS="-O2 -DSQLITE_ENABLE_COLUMN_METADATA" ./configure --prefix=/usr/local --quiet && make -s -j"$(nproc)" && sudo make -s install)
          sudo ldconfig
          php -r '$v = (new PDO("sqlite::memory:"))->query("select sqlite_version()")->fetchColumn(); echo "PHP SQLite $v\n"; exit(version_compare($v, "3.46", "<") ? 1 : 0);'
      - name: install PHP dependencies
        run: composer install --working-dir=clients/php --no-interaction --no-progress --prefer-dist
      - name: programs of the database servers
        # make test-servers starts the servers of the database checks from these
        # programs, as it does locally: MySQL 8.4.11 from the five packages of
        # its Ubuntu 24.04 deb bundle, PostgreSQL 17 and PgBouncer from the
        # PostgreSQL apt repository, and ProxySQL 3.0.9 from its package. apt
        # installs the dependencies of each package, such as libaio1t64 for
        # mysqld, and replaces the MySQL 8.0 packages of the image, so
        # make test-servers finds mysqld at its package path /usr/sbin/mysqld on
        # PATH. The image loads an AppArmor profile for /usr/sbin/mysqld that
        # allows only /var/lib/mysql; it is removed because the servers keep
        # their data in .runtime/servers.
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q postgresql-common sqlite3 >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -q postgresql-17 pgbouncer >/dev/null
          curl -fsSL -o /tmp/proxysql.deb https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/noble/proxysql_3.0.9-ubuntu24_amd64.deb
          sudo apt-get install -y -q /tmp/proxysql.deb >/dev/null
          mkdir /tmp/mysql
          curl -fsSL https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-server_8.4.11-1ubuntu24.04_amd64.deb-bundle.tar | tar -xf - -C /tmp/mysql
          if sudo grep -qs '^/usr/sbin/mysqld ' /sys/kernel/security/apparmor/profiles; then
            printf /usr/sbin/mysqld | sudo tee /sys/kernel/security/apparmor/.remove >/dev/null
          fi
          sudo apt-get install -y -q $(for package in mysql-common mysql-community-client-plugins mysql-community-client-core mysql-community-client mysql-community-server-core; do echo "/tmp/mysql/${package}_8.4.11-1ubuntu24.04_amd64.deb"; done) >/dev/null
          test "$(command -v mysqld)" = /usr/sbin/mysqld
          mysqld --version | grep -F ' Ver 8.4.11 '
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: database servers
        # The MySQL and PostgreSQL primaries and replicas, ProxySQL and PgBouncer,
        # the databases orm_test, orm_tools and orm_bench, and the environment
        # file .runtime/servers/env that the database checks read.
        run: make test-servers
      - name: environment of the database servers
        # Steps that run go test, cargo test or php without make read the same
        # variables from the process environment.
        run: sed -e 's/^export //' -e "s/='\(.*\)'$/=\1/" .runtime/servers/env >> "$GITHUB_ENV"
      - name: feature, documentation, and package contracts
        run: make repo-check feature-check git-check docs-rules-check docs-check docs-verify-idempotent package-check
      - name: decoder fuzz smoke checks
        run: make fuzz-check
      - name: Go
        run: go vet ./... && go test -v -timeout 0 ./...
      - name: generated Go models are current
        run: make go-model-check
      - name: generated TypeScript models are current
        run: make ts-model-check
      - name: common interfaces
        run: make interface-check
      - name: PHP
        run: make client-unit-check
      - name: TypeScript
        run: make ts-check
      - name: Rust
        run: make rust-check rust-fmt-check rust-150-check rust-driver-check
      - name: client database tests (SQLite, MySQL, PostgreSQL)
        run: make client-db-check
      - name: conformance (4 languages identical on 3 databases)
        run: make conformance-check
      - name: common state and execution contracts
        run: |
          go run ./tests/interfaces/check --results tests/conformance/out
          go run ./tests/interfaces/check --results tests/conformance/out/postgres
          go run ./tests/interfaces/check --results tests/conformance/out/sqlite
      - name: codec vectors
        run: |
          go test -v -timeout 0 ./clients/go/orm -run TestCodec
          (cd clients/rust && cargo test --locked -p orm codec)
          php tests/codec/check.php
      - name: hot-path regression gate
        run: make perf-check
