# CI: make check, the targets of the local checks, against MySQL, PostgreSQL,
# and SQLite, with the common interfaces and the hot-path regression check of
# feature-check, the decoder fuzz checks and the common state contracts of the
# conformance results. This is where the full suite runs: after a push, never
# stopping at a failure, and recording enough to fix every failure before the
# next run. A check it lacks belongs in a target of CHECK_TARGETS, and make
# repo-check fails a step after make check other than the summary and the
# report upload.
# make test-servers starts the database servers and writes their DSNs, as it
# does for the local checks. No step or job has timeout-minutes: every step
# (a checkout, an install, a server start, a tool run or a whole suite) is a
# long operation, which the runner logs line by line and judges by its exit
# code, with no deadline; only a test case inside a suite has its own
# deadline. make repo-check fails a workflow with timeout-minutes.
name: ci
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

# A new push cancels the run of the push before it on the same ref: the runners are few, and only the run of the
# newest head counts. make repo-check requires this on every workflow that runs on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # .github/runner declares the runner of every job; make repo-check
    # requires it.
    runs-on: ubuntu-26.04-arm
    # Every setup step has an id that scripts/check/ci-setup.mjs maps to what it
    # installs, and runs whatever the earlier steps did (if: !cancelled()), so
    # one failed install never hides another. make check runs after all of
    # them and reads their results (ORM_CI_SETUP): a target that needs what a
    # failed step installs is recorded as not-run with that step, and every
    # other target runs. A failed step fails the job. The checkout and Node are
    # what the runner itself needs.
    steps:
      # git-check reads the commits of the push or the pull request
      # (ORM_GIT_RANGE of make check), so the checkout carries the full commit
      # graph.
      - uses: actions/checkout@v5
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        id: go
        if: ${{ !cancelled() }}
        # .go-version declares the one Go release of the checks, locally and
        # here; make repo-check requires it.
        with: { go-version-file: .go-version }
      # make check runs go with GOPROXY=off; make install-go downloads the
      # modules of go.mod.
      - name: Go modules
        id: go-modules
        if: ${{ !cancelled() }}
        run: make install-go
      # .node-version declares the one Node release of the checks, locally and
      # here; make repo-check requires it. make ts-min-check runs the
      # TypeScript client on the lowest release of package.json engines.node.
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          cache: npm
      - name: install Node dependencies
        id: node-modules
        if: ${{ !cancelled() }}
        run: make install-node
      - name: lowest Node release of the TypeScript client
        id: node-min
        if: ${{ !cancelled() }}
        run: make install-node-min
      - name: Chromium of the documentation smoke test
        id: browsers
        if: ${{ !cancelled() }}
        run: make install-browsers
      - name: Rust toolchain of rust-toolchain.toml
        id: rust
        if: ${{ !cancelled() }}
        # rustup installs the channel and components that rust-toolchain.toml
        # declares; every cargo and rustc run of the repository uses them.
        # rustup installs the channel and components of rust-toolchain.toml, and
        # make check runs cargo offline on the crates of every Cargo.lock that
        # make install-rust downloads.
        run: make install-rust
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        if: ${{ !cancelled() }}
        with:
          workspaces: |
            clients/rust -> target
            bench/rust -> target
            tests/interfaces/rust -> target
      - name: lowest PHP release of the PHP client
        # make php-min-check runs the PHP client unit tests on the lowest release
        # of require.php in clients/php/composer.json; setup-php installs it
        # first, and the PHP of .php-version after it becomes php on PATH.
        id: php-min
        if: ${{ !cancelled() }}
        run: make --no-print-directory ci-php-min-version >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        id: php-min-release
        if: ${{ !cancelled() }}
        with:
          php-version: ${{ steps.php-min.outputs.version }}
          extensions: pdo_sqlite, openssl
          # .composer-version declares the one Composer release of the checks.
          tools: composer:2.10.3
          coverage: none
      # .php-version declares the PHP release of the checks, locally and here.
      - uses: shivammathur/setup-php@v2
        id: php
        if: ${{ !cancelled() }}
        with:
          php-version-file: .php-version
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, openssl
          tools: composer:2.10.3
          # The checks run PHP without a debugger or coverage driver, as the local
          # PHP does; Xdebug changes the ratios of the hot-path gate.
          coverage: none
      - name: PHP releases and their SQLite
        id: php-sqlite
        if: ${{ !cancelled() }}
        # Every client requires SQLite 3.46; PHP links the system SQLite of
        # the runner.
        run: make ci-php-sqlite
      - name: install PHP dependencies
        id: composer
        if: ${{ !cancelled() }}
        run: make install-php
      - name: tools of the PHP extension build
        id: php-extension-tools
        if: ${{ !cancelled() }}
        # make dbspec-php-extension-check and make dbspec-compare-check build
        # the PHP extension orm_dbspec with phpize and check its arginfo with
        # gen_stub.php; scripts/ci/php-extension-tools.sh checks phpize and
        # php-config and installs gen_stub.php with its PHP-Parser.
        run: make install-php-extension-tools
      - name: programs of the database servers
        id: server-programs
        if: ${{ !cancelled() }}
        # scripts/ci/server-programs.sh installs the programs from which make
        # test-servers starts the servers.
        run: make install-server-programs
      - name: database servers
        # The MySQL and PostgreSQL primaries and replicas, ProxySQL and PgBouncer,
        # the databases orm_test, orm_tools and orm_bench, and the environment
        # file .runtime/servers/env that the database checks read. make check
        # records the targets that need the servers as not-run with this failure
        # and runs every other target.
        id: servers
        if: ${{ !cancelled() }}
        run: make test-servers
      - name: make check
        # The targets of CHECK_TARGETS through the runner of the local checks,
        # with its own bench and decimal databases; make repo-check fails
        # when this workflow omits or repeats one of them or a verification
        # command of feature-check. The run never stops at a failure: every
        # target runs unless a setup step it needs failed, and the step fails
        # when a target failed or did not run. The report of the run is
        # .runtime/check/ci_<run id>_<attempt>/report.
        if: ${{ !cancelled() }}
        env:
          ORM_CHECK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ORM_CI_SETUP: ${{ toJSON(steps) }}
          # The commits git-check reads: the pull request, or the push when it
          # adds to a branch; a new branch, a forced push and a manual run give
          # none, and git-check reads HEAD.
          ORM_GIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || (github.event_name == 'push' && !github.event.created && !github.event.forced) && format('{0}..{1}', github.event.before, github.sha) || '' }}
        run: make check
      # The summary of the run, also of a runner that did not finish, as the job
      # summary and in the report, with the run record and the server logs; then
      # the report of this run id alone, so no file of an earlier run is
      # collected. make repo-check allows exactly these two steps after make
      # check.
      - name: summary
        if: ${{ !cancelled() }}
        env:
          ORM_CHECK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/check/summary.mjs
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/check/ci_${{ github.run_id }}_${{ github.run_attempt }}/report/
          if-no-files-found: error
