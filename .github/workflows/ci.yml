# CI: the planner, the four clients, conformance and codec vectors against
# MySQL, PostgreSQL, and SQLite, and the hot-path gate.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orm
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: orm_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orm"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: orm_bench
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # bench databases for conformance and the hot-path gate
      BENCH_MYSQL_DSN: "mysql://root@127.0.0.1:3306/orm_bench?timezone=%2B00:00"
      BENCH_POSTGRES_DSN: "postgres://orm@127.0.0.1:5432/orm_bench?sslmode=disable&timezone=%2B00:00"
      BENCH_SQLITE_DSN: "sqlite:///tmp/orm_bench.sqlite?_pragma=busy_timeout(5000)&timezone=%2B00:00"
      # empty databases for client tests that create and drop tables
      ORM_TEST_MYSQL_DSN: "mysql://root@127.0.0.1:3306/orm_test"
      ORM_TEST_POSTGRES_DSN: "postgres://orm@127.0.0.1:5432/orm_test?sslmode=disable"
      # empty databases for the schema tool tests of every language, which drop every table
      ORM_TOOLS_MYSQL_DSN: "mysql://root@127.0.0.1:3306/orm_tools"
      ORM_TOOLS_POSTGRES_DSN: "postgres://orm@127.0.0.1:5432/orm_tools?sslmode=disable"
      # the bench database the hot-path gates of every check select
      ORM_BENCH_MYSQL_DSN: "mysql://root@127.0.0.1:3306/orm_bench"
    steps:
      # git-check reads history from the recorded subject-format baseline, so
      # the checkout must carry the full commit graph.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with: { go-version: "1.27" }
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - name: install Node dependencies
        run: |
          npm ci
          npm ci --prefix clients/typescript
          npx playwright install --with-deps chromium
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/rust -> target
            bench/rust -> target
            tests/interfaces/rust -> target
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, openssl
      - name: SQLite 3.46+ for PHP
        # PHP links the system SQLite (3.45 on Ubuntu 24.04); every client
        # requires 3.46, so a newer library in /usr/local/lib takes its place.
        # pdo_sqlite needs the column metadata functions the system build has.
        run: |
          curl -fsSL https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz | tar -xz -C /tmp
          (cd /tmp/sqlite-autoconf-3460100 && CFLAGS="-O2 -DSQLITE_ENABLE_COLUMN_METADATA" ./configure --prefix=/usr/local --quiet && make -s -j"$(nproc)" && sudo make -s install)
          sudo ldconfig
          php -r '$v = (new PDO("sqlite::memory:"))->query("select sqlite_version()")->fetchColumn(); echo "PHP SQLite $v\n"; exit(version_compare($v, "3.46", "<") ? 1 : 0);'
      - name: install PHP dependencies
        run: composer install --working-dir=clients/php --no-interaction --no-progress --prefer-dist
      - name: prepare databases
        run: |
          sudo apt-get install -y -q postgresql-client sqlite3 >/dev/null
          docker exec ${{ job.services.mysql.id }} sh -c 'mysql_tzinfo_to_sql /usr/share/zoneinfo 2>/dev/null | mysql -uroot mysql'
          mysql -h 127.0.0.1 -uroot -e 'CREATE DATABASE orm_test; CREATE DATABASE orm_tools'
          psql -h 127.0.0.1 -U orm orm_bench -q -c 'CREATE DATABASE orm_test' -c 'CREATE DATABASE orm_tools'
          mysql -h 127.0.0.1 -uroot --init-command="SET time_zone='+00:00'" orm_bench < bench/sql/battle.sql
          mysql -h 127.0.0.1 -uroot --init-command="SET time_zone='+00:00'" orm_bench < bench/sql/seed.mysql.sql
          PGTZ=UTC psql -h 127.0.0.1 -U orm orm_bench -q -v ON_ERROR_STOP=1 -f bench/sql/battle.pg.sql
          PGTZ=UTC psql -h 127.0.0.1 -U orm orm_bench -q -v ON_ERROR_STOP=1 -f bench/sql/seed.pg.sql
          sqlite3 /tmp/orm_bench.sqlite < bench/sql/battle.sqlite.sql
          sqlite3 /tmp/orm_bench.sqlite < bench/sql/seed.sqlite.sql
          go run ./bench/seedaes -driver mysql -dsn 'root@tcp(127.0.0.1:3306)/orm_bench?parseTime=true'
          go run ./bench/seedaes -driver postgres -dsn 'postgres://orm@127.0.0.1:5432/orm_bench?sslmode=disable'
          go run ./bench/seedaes -driver sqlite -dsn 'file:/tmp/orm_bench.sqlite'
      - name: feature, documentation, and package contracts
        run: make feature-check git-check docs-rules-check docs-check docs-verify-idempotent package-check
      - name: decoder fuzz smoke checks
        run: make fuzz-check
      - name: Go
        run: go vet ./... && go test ./...
      - name: generated Go models are current
        run: make go-model-check
      - name: common interfaces
        run: make interface-check
      - name: schema rules
        run: make schema-check
      - name: PHP
        run: make client-unit-check
      - name: TypeScript
        run: make ts-check
      - name: Rust
        run: make rust-check rust-150-check rust-driver-check
      - name: client database tests (SQLite, MySQL, PostgreSQL)
        run: make client-db-check
      - name: conformance (4 languages identical on 3 databases)
        run: |
          (cd clients/rust && cargo build --locked --release -p orm-tests --bin conformance)
          npm run typescript:build
          go run ./tests/conformance/check run -driver mysql -dsn "$BENCH_MYSQL_DSN"
          go run ./tests/conformance/check run -driver postgres -dsn "$BENCH_POSTGRES_DSN"
          go run ./tests/conformance/check run -driver sqlite -dsn "$BENCH_SQLITE_DSN"
      - name: common state and execution contracts
        run: |
          go run ./tests/interfaces/check --results tests/conformance/out
          go run ./tests/interfaces/check --results tests/conformance/out/postgres
          go run ./tests/interfaces/check --results tests/conformance/out/sqlite
      - name: codec vectors
        run: |
          go test ./clients/go/orm -run TestCodec
          (cd clients/rust && cargo test --locked -p orm codec)
          php tests/codec/check.php
      - name: hot-path regression gate
        run: make perf-check
      - name: physical migration recovery
        run: CI=true ./scripts/db-test.sh
