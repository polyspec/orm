# CI: every check of the repository. Every job runs one step, make ci-<job>, whose recipe in the Makefile holds the order
# and the conditions of the job, so a local make ci-<job> NAME=value runs what CI runs (T497); its other steps are uses:
# steps that provision the runner (the checkout, the caches, the kit bootstrap, setup-php, the Rust cache) or carry a result
# (the report). What those steps need before the run step is an output of the job plan (make ci-plan): the cache keys, the
# matrix of the CI groups with whether each group sets up PHP and Rust, and the lowest PHP release of the PHP client.
# The job preflight runs the CI group preflight, the checks of the structure of the repository, and every other job needs it,
# so their failure ends the run before any suite starts (T428). The job test runs the CI groups of the Makefile (CI_GROUPS):
# one job per group, all at once, each running make ci-test GROUP=<group>, which runs the setup steps that the targets of the
# group need and then make check-run GROUP=<group> on the targets CI_TARGETS_<group>; the groups together run every target
# of CHECK_TARGETS once. The job assets builds the binding assets of each platform from the commit (assets.yml). The job docs
# runs the documentation checks of the published site, and the last job ci-passed, the run whose id the release takes (make
# release-tag requires its success), passes only when every other job succeeded. This is where the full suite runs: on every
# push to main and on a manual run, never stopping at a failure, and recording enough to fix every failure before the next
# run. A check it lacks belongs in a target of CHECK_TARGETS. No step or job has timeout-minutes: every step is a long
# operation, which the runner logs line by line and judges by its exit code, with no deadline; only a test case inside a
# suite has its own deadline. make repo-check fails a workflow with timeout-minutes.
# A push whose every changed path is a document that only the document checks read starts no run (T418): paths-ignore lists
# DOCUMENT_PATHS of scripts/repo/ci.mts, and documents.yml runs those checks on every push. GitHub starts the run when any
# changed path of the whole push matches no pattern, so a code change pushed with documents runs every job, and a version
# commit changes VERSION, so it runs every job and the release takes its run. Past 3000 changed files GitHub does not
# evaluate the filter; documents.yml fails such a push (make diff-size-check). make repo-check requires this list and fails a
# listed document that a check outside DOCUMENT_CHECKS of the Makefile reads. A manual run runs every job.
name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG*.md'
      - 'CODE_OF_CONDUCT*.md'
      - 'CONTRIBUTING*.md'
      - 'PRINCIPLES*.md'
      - 'README*.md'
      - 'SECURITY*.md'
      - 'docs/plans/check-recipes/**'
      - 'docs/plans/cross-verification/**'
      - 'docs/plans/execution/**'
      - 'docs/plans/kit-standard/plan.md'
      - 'docs/plans/kit-standard/*.ko.md'
  workflow_dispatch:

# A new run cancels the run before it on the same ref: the runners are few, and only the run of the newest head
# counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plan of the other jobs (make ci-plan): the cache keys, which are the hashes of the tracked lock files, computed once,
  # since actions/cache evaluates its key again after the last step, where hashFiles would read the workspace as the job left
  # it (T427); the matrix of the CI groups; and the lowest PHP release of the PHP client.
  plan:
    runs-on: ubuntu-26.04-arm
    outputs:
      npm: ${{ steps.plan.outputs.npm }}
      tools: ${{ steps.plan.outputs.tools }}
      go: ${{ steps.plan.outputs.go }}
      composer: ${{ steps.plan.outputs.composer }}
      uv: ${{ steps.plan.outputs.uv }}
      groups: ${{ steps.plan.outputs.groups }}
      preflight: ${{ steps.plan.outputs.preflight }}
      php_min: ${{ steps.plan.outputs.php_min }}
    steps:
      - uses: actions/checkout@v5
      # The bootstrap of kit (K992): .github/actions/kit-bootstrap installs the Node.js of mise.toml, the locked kit package
      # and the packages, with which scripts/php/php-min.mts reads composer.json.
      - uses: ./.github/actions/kit-bootstrap
      - id: plan
        run: make ci-plan

  # The gates of orm: ci-pipeline.yml, which orm owns (T391), plans and runs the shared and runtime gates with the targets of
  # the Makefile. No job waits for it but ci-passed: every other job installs what it runs itself.
  kit:
    needs: [preflight]
    uses: ./.github/workflows/ci-pipeline.yml
    permissions:
      contents: read

  # The binding assets of each platform (assets.yml), built from the commit of the run, so the run proves that the release of
  # this commit builds every asset.
  assets:
    needs: [preflight]
    uses: ./.github/workflows/assets.yml
    permissions:
      contents: read

  # The rehearsal of the release upload (T628, binding B2.496-1): after the assets of every platform, it gathers the release
  # assets of this commit as the job release of release.yml does and rehearses release-platform-assets for the version of
  # this commit with no tag and no upload, so the CI run of a version commit is the dry run of its release. The job reads the
  # repository only, and ci-passed needs it, so a commit whose rehearsal fails is not released.
  release-rehearsal:
    needs: [plan, assets]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: cache of the npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-packages-${{ runner.os }}-${{ needs.plan.outputs.npm }}
      - name: cache of the tools of mise.toml
        uses: actions/cache@v4
        with:
          path: var/tools
          key: tools-${{ runner.os }}-${{ needs.plan.outputs.tools }}
      # The Go module of the release is built by release-recipes and release-assets.
      - name: cache of the Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ needs.plan.outputs.go }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version for the Composer archives, as the job release of release.yml.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: composer:2.10.3
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, into var/release/platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: assets-*
          path: var/release/platform
          merge-multiple: true
      - run: make ci-release-rehearsal
      # actions/upload-artifact v4: the log of the rehearsal, the evidence that it names every label and uploads nothing.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal
          path: var/release/rehearsal
          if-no-files-found: error

  test:
    needs: [plan, preflight]
    # .github/runner declares the runner of every job; make repo-check requires it.
    runs-on: ubuntu-26.04-arm
    # One job per CI group of the Makefile but preflight (the output groups of make ci-plan). A failed group does not cancel
    # the others: every group runs to its end.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      # The kit tools read the commit graph, so the checkout carries the full commit graph.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The caches of the locked installs, keyed by the hashes of their lock files (B3-4); setup-node keeps its own cache
      # off (scripts/repo/node.mts).
      - name: cache of the npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-packages-${{ runner.os }}-${{ needs.plan.outputs.npm }}
      - name: cache of the tools of mise.toml
        uses: actions/cache@v4
        with:
          path: var/tools
          key: tools-${{ runner.os }}-${{ needs.plan.outputs.tools }}
      - name: cache of the Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ needs.plan.outputs.go }}
      - name: cache of the composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-packages-${{ runner.os }}-${{ needs.plan.outputs.composer }}
      - name: cache of the uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-packages-${{ runner.os }}-${{ needs.plan.outputs.uv }}
      # The bootstrap of kit (K992): .github/actions/kit-bootstrap installs the locked kit package and the packages.
      - uses: ./.github/actions/kit-bootstrap
      # make php-min-check runs the PHP client unit tests on the lowest release of require.php in
      # legacy/packages/php/composer.json; setup-php installs it first, and the PHP of .php-version after it becomes php on
      # PATH. A group sets up PHP when a target of it needs PHP (matrix.php of make ci-plan).
      - uses: shivammathur/setup-php@v2
        if: ${{ matrix.php }}
        with:
          php-version: ${{ needs.plan.outputs.php_min }}
          extensions: pdo_sqlite, openssl
          # mise.toml declares the one Composer release of the checks (http:composer).
          tools: composer:2.10.3
          coverage: none
      # .php-version declares the PHP release of the checks, locally and here. The checks run PHP without a debugger or
      # coverage driver, as the local PHP does; Xdebug changes the ratios of the hot-path gate.
      - uses: shivammathur/setup-php@v2
        if: ${{ matrix.php }}
        with:
          php-version-file: .php-version
          extensions: pdo_mysql, pdo_pgsql, pgsql, pdo_sqlite, openssl
          tools: composer:2.10.3
          coverage: none
      # The build cache of the Rust targets, for a group whose targets need Rust (matrix.rust of make ci-plan).
      - uses: Swatinem/rust-cache@v2
        if: ${{ matrix.rust }}
        with:
          workspaces: |
            packages/rust -> target
            benchmarks/rust -> target
            packages/rust/testing/interfaces -> target
      # make ci-test runs the setup steps that the targets of the group need, stopping at the first failure, then make
      # check-run GROUP=<group>, which records a target that needs what a failed or skipped setup step installs as not-run and
      # runs every other target, then the summary, also of a runner that did not finish, as the job summary. The report of the
      # run is .runtime/check/ci_<run id>_<attempt>_<group>/report.
      - run: make ci-test GROUP=${{ matrix.group }}
      # The report of this run id alone, so no file of an earlier run is collected.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/check/ci_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.group }}/report/
          if-no-files-found: error

  # The group preflight of the Makefile (CI_TARGETS_preflight): the checks of the structure of the repository, which every other
  # job needs, so a defect they find ends the run in this job before any suite starts (T428). It provisions the runner as the
  # job test does, for its own group (the output preflight of make ci-plan).
  preflight:
    needs: [plan]
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.preflight) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: cache of the npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-packages-${{ runner.os }}-${{ needs.plan.outputs.npm }}
      - name: cache of the tools of mise.toml
        uses: actions/cache@v4
        with:
          path: var/tools
          key: tools-${{ runner.os }}-${{ needs.plan.outputs.tools }}
      - name: cache of the Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ needs.plan.outputs.go }}
      - name: cache of the composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-packages-${{ runner.os }}-${{ needs.plan.outputs.composer }}
      - name: cache of the uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-packages-${{ runner.os }}-${{ needs.plan.outputs.uv }}
      - uses: ./.github/actions/kit-bootstrap
      - uses: shivammathur/setup-php@v2
        if: ${{ matrix.php }}
        with:
          php-version: ${{ needs.plan.outputs.php_min }}
          extensions: pdo_sqlite, openssl
          tools: composer:2.10.3
          coverage: none
      - uses: shivammathur/setup-php@v2
        if: ${{ matrix.php }}
        with:
          php-version-file: .php-version
          extensions: pdo_mysql, pdo_pgsql, pgsql, pdo_sqlite, openssl
          tools: composer:2.10.3
          coverage: none
      - uses: Swatinem/rust-cache@v2
        if: ${{ matrix.rust }}
        with:
          workspaces: |
            packages/rust -> target
            benchmarks/rust -> target
            packages/rust/testing/interfaces -> target
      - run: make ci-preflight
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/check/ci_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.group }}/report/
          if-no-files-found: error

  # The documentation checks of the site that docs-pages.yml publishes, with its base path (make ci-docs): docs-verify-idempotent
  # builds docs/.vitepress/dist twice and compares every byte, and docs-site-check builds it and reads its pages and links with
  # Node. make docs-ci runs the two through the runner of make orm-check, also after a failed one, and writes the log of each
  # and a summary to the report of this run id, which the last step uploads whatever the result.
  docs:
    needs: [plan, preflight]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: cache of the npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-packages-${{ runner.os }}-${{ needs.plan.outputs.npm }}
      - name: cache of the tools of mise.toml
        uses: actions/cache@v4
        with:
          path: var/tools
          key: tools-${{ runner.os }}-${{ needs.plan.outputs.tools }}
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-docs
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/check/ci_${{ github.run_id }}_${{ github.run_attempt }}_docs/report/
          if-no-files-found: error

  # The VS Code integration test of the dbspec extension (make ci-editor): the editor fixtures through
  # vscode.provideDocumentSemanticTokens inside the VS Code that make orm-install-vscode installs (kit's installer, at the
  # minimum release of packages/dbspec-vscode). VS Code needs a display, so the test runs on a virtual X server.
  editor:
    needs: [plan, preflight]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: cache of the npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-packages-${{ runner.os }}-${{ needs.plan.outputs.npm }}
      - name: cache of the tools of mise.toml
        uses: actions/cache@v4
        with:
          path: var/tools
          key: tools-${{ runner.os }}-${{ needs.plan.outputs.tools }}
      # dbspec-vscode-check builds the shared lease runner; it uses only x/sys from the Go client module.
      - name: cache of the Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ needs.plan.outputs.go }}
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-editor

  # The one check of this workflow that the release requires: it runs after every other job, also after a failed or
  # cancelled one (if: always()), and passes only when each job of needs succeeded, every CI group of test included. make
  # repo-check requires that it is the last job and that needs lists every other job.
  ci-passed:
    if: ${{ always() }}
    needs: [plan, preflight, kit, assets, release-rehearsal, test, docs, editor]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/kit-bootstrap
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed FAIL_SKIPPED=1
