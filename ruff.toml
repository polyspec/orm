# The ruff configuration of every polyspec repository, copied by kit; change it in kit, never in a copy. make lint-python runs
# ruff with --config ruff.toml, so every Python file of the repository is checked with these rules, and config/layout.kit.yml
# forbids a nested ruff configuration, which would escape them in an editor or a plain ruff run.
target-version = "py314"
# ruff's own setting for its cache, which otherwise is .ruff_cache at the root (layout S5 refuses it): var holds what the tools
# write, and the setting holds for every ruff run of the repository, an editor's too. ruff reads the path relative to this file
# when it finds the file and relative to its working directory under --config, so both are the root under make lint-python.
cache-dir = "var/ruff"

[lint]
# P8, errors are never hidden (K256, K334): E722 a bare except, BLE001 a blind except of Exception, S110 and S112 an except that
# only passes or continues (also a typed one, see flake8-bandit below), SIM105 a try that only suppresses a typed exception
# (contextlib.suppress, which the suppression check asks a reason for), TRY203 an except that only re-raises, TRY201 a raise
# that drops the traceback, TRY400 an error logged without its traceback, B012 a jump out of finally, PGH003 and PGH004 a
# type: ignore and a noqa without a rule, RUF100 a noqa that suppresses nothing.
select = ["E4", "E7", "E9", "F", "TID251", "BLE001", "S110", "S112", "SIM105", "TRY201", "TRY203", "TRY400", "B012", "PGH003", "PGH004", "RUF100"]

[lint.flake8-bandit]
# A typed except that only passes or continues hides its error as a blind one does; it needs a stated reason.
check-typed-exception = true

[lint.per-file-ignores]
# A vulture whitelist names the code it keeps as bare names and attributes of `_`, which it never defines.
"**/vulture_whitelist.py" = ["F821"]

# S3: tests run against the installed package. ruff resolves a qualified name statically, so the module sys reached through
# importlib.import_module("sys") escapes the sys.path ban; import_module is banned with it, since an import statement names
# every module that a test needs. __import__("sys") and getattr(sys, "path") stay beyond a static check (docs/operations/tool-inventory.md).
[lint.flake8-tidy-imports.banned-api]
"sys.path".msg = "S3: tests run against the installed package; never change sys.path"
"importlib.import_module".msg = "S3: import the module with an import statement; a module chosen at run time escapes the sys.path ban"
"importlib.util.spec_from_file_location".msg = "S3: import the module from its installed package, never from a file path"
"importlib.machinery.SourceFileLoader".msg = "S3: import the module from its installed package, never from a file path"
