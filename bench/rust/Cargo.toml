[package]
name = "orm-bench"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "native"
path = "src/native.rs"

[[bin]]
name = "driver_compare"
path = "src/driver_compare.rs"

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
debug = false
