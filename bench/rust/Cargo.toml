[package]
name = "polyspec-orm-bench"
version = "0.0.16"
edition = "2021"
rust-version = "1.99.0"
publish = false

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"

[[bin]]
name = "native"
path = "src/native.rs"

[[bin]]
name = "driver_compare"
path = "src/driver_compare.rs"

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
polyspec-orm = { path = "../../packages/rust/orm" }

[profile.release]
opt-level = 3
debug = false

[dev-dependencies]
# test case가 시작, 결과, 경과 시간과 자기 기한을 보고한다.
polyspec-orm-testcase = { path = "../../packages/rust/testcase" }
