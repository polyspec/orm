[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-orm"
version = "0.0.19"
description = "Python ORM: model generator and native SQL assembly for MySQL, PostgreSQL, and SQLite"
license = "MIT"
requires-python = ">=3.14"
# Wheels support CPython only (docs/operations/packaging.md, Python client release). The toolchain is python-build-standalone CPython.
classifiers = ["Programming Language :: Python :: Implementation :: CPython"]
dependencies = [
    # Python wheel of ordered-json (release v0.0.14). The polyspec dependency is a direct reference to the release asset and its sha256 (docs/operations/packaging.md, kit K49).
    "polyspec-ordered-json @ https://github.com/polyspec/ordered-json/releases/download/v0.0.14/polyspec_ordered_json-0.0.14-py3-none-any.whl#sha256=1e1306c3ac50db3256ab6a825bc7adc0ba7274a78d0465593b8e0089dfce4a3a",
    "cryptography==50.0.2",
    "PyMySQL==1.2.3",
    # Same install as psycopg[binary]==3.3.6: the extra binary requires psycopg-binary==3.3.6.
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    # rapidyaml 0.15.2 writes each error to stderr before its python module raises it; the fork polyspec/rapidyaml-python
    # 0.15.2.post1 installs error handlers that only throw (biojppm/rapidyaml#679). Its CPython 3.14 wheel of each platform is a direct
    # reference to the release asset and its sha256 (docs/operations/packaging.md, kit K49).
    "rapidyaml @ https://github.com/polyspec/rapidyaml-python/releases/download/v0.15.2.post1/rapidyaml-0.15.2.post1-cp314-cp314-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl#sha256=2cb4de79c43c0e64c6d9a351ef566ed847e1809e2ceba8190534bd9b7570bc14 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rapidyaml @ https://github.com/polyspec/rapidyaml-python/releases/download/v0.15.2.post1/rapidyaml-0.15.2.post1-cp314-cp314-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl#sha256=fc6c1570512ea36044b3f0ec5ed20c665f7bd1528c1aa159cd9cb5ca95caa1b9 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "rapidyaml @ https://github.com/polyspec/rapidyaml-python/releases/download/v0.15.2.post1/rapidyaml-0.15.2.post1-cp314-cp314-macosx_11_0_arm64.whl#sha256=bce9b42f6b56678f066ecd088be73add18a279c73e21619860666236afd574f4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "rapidyaml @ https://github.com/polyspec/rapidyaml-python/releases/download/v0.15.2.post1/rapidyaml-0.15.2.post1-cp314-cp314-macosx_10_15_x86_64.whl#sha256=fc7a1b516bf6c59605beb5e7430a0350351bcce5a5ae7915527eec90f46dad35 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "rapidyaml @ https://github.com/polyspec/rapidyaml-python/releases/download/v0.15.2.post1/rapidyaml-0.15.2.post1-cp314-cp314-win_amd64.whl#sha256=8692aa30e4bdae6efc8a743de5188349f0cf78bde3587e087de1f06c5178b72d ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "rapidyaml @ https://github.com/polyspec/rapidyaml-python/releases/download/v0.15.2.post1/rapidyaml-0.15.2.post1-cp314-cp314-win_arm64.whl#sha256=1c799d5fea34c449197f99cc52d8d85f0c14117bce049e4e3b27d49a716299c6 ; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "ruamel.yaml==0.19.1",
]


[project.scripts]
orm-gen = "polyspec.orm.bin_orm_gen:main"

[tool.uv]
default-groups = ["test"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
# polyspec.orm.testing is the test entry point (docs/spec/protocol.md "Test faults"). The distribution contains it, while the package entry
# point polyspec.orm does not import it.

[tool.setuptools.package-data]
"polyspec.orm" = ["py.typed"]

[dependency-groups]
# test is what the tests of this repository need beside the client (PEP 735, not part of the released wheel): jsonschema-rs
# reads the shared dbspec vectors against their JSON Schemas (tests/dbspec/schema). make orm-install-python installs it into the
# venv; the client never imports it.
# setuptools' package finder defines the release boundary read by the interface extractor.
test = ["jsonschema-rs==0.60.3", "setuptools==84.2.1"]
