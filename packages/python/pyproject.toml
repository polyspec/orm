[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-orm"
version = "0.0.18"
description = "Python ORM: model generator and native SQL assembly for MySQL, PostgreSQL, and SQLite"
license = "MIT"
requires-python = ">=3.14"
# Wheels support CPython only (docs/operations/packaging.md, Python client release). The toolchain is python-build-standalone CPython.
classifiers = ["Programming Language :: Python :: Implementation :: CPython"]
dependencies = [
    # Python wheel of ordered-json (release v0.0.9). The polyspec dependency is a direct reference to the release asset and its sha256 (docs/operations/packaging.md, kit K49).
    "polyspec-ordered-json @ https://github.com/polyspec/ordered-json/releases/download/v0.0.9/polyspec_ordered_json-0.0.9-py3-none-any.whl#sha256=bc4d26a9d5dcd42a72d7bb40f6b7c7dc749c710d3c60f2e9f4fe3e733102f01d",
    "cryptography==50.0.2",
    "PyMySQL==1.2.3",
    # Same install as psycopg[binary]==3.3.6: the extra binary requires psycopg-binary==3.3.6.
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "rapidyaml==0.15.2",
    "ruamel.yaml==0.19.1",
]


[project.scripts]
orm-gen = "polyspec.orm.bin_orm_gen:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
# polyspec.orm.testing is the test entry point (docs/spec/protocol.md "Test faults"). The distribution contains it, while the package entry
# point polyspec.orm does not import it.

[tool.setuptools.package-data]
"polyspec.orm" = ["py.typed"]

[dependency-groups]
# test is what the tests of this repository need beside the client (PEP 735, not part of the released wheel): jsonschema-rs
# reads the shared dbspec vectors against their JSON Schemas (tests/dbspec/schema). make orm-install-python installs it into the
# venv; the client never imports it.
test = ["jsonschema-rs==0.58.6"]

# The models that orm-gen generates and the Makefile's go-model-check compares byte for byte: their methods are API for
# the consumers of the bench models, and the generated text is never edited by hand.
[tool.vulture]
exclude = ["src/polyspec/orm/models/"]
