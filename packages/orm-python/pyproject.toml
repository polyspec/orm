[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-orm"
version = "0.0.4"
description = "Python ORM: model generator and native SQL assembly for MySQL, PostgreSQL, and SQLite"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # ordered-json의 Python 배포(release v0.0.7).
    "polyspec-ordered-json @ git+https://github.com/polyspec/ordered-json@v0.0.7#subdirectory=packages/ordered-json-python",
    "cryptography==50.0.2",
    "PyMySQL==1.2.3",
    "psycopg[binary]==3.3.6",
    "PyYAML==6.0.3",
]

[project.scripts]
orm-gen = "polyspec.orm.bin_orm_gen:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"polyspec.orm" = ["py.typed"]
