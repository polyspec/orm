[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-orm"
version = "0.0.7"
description = "Python ORM: model generator and native SQL assembly for MySQL, PostgreSQL, and SQLite"
license = "MIT"
requires-python = ">=3.14"
# wheel은 CPython만 지원한다(docs/packaging.md, Python client release). toolchain은 python-build-standalone CPython이다.
classifiers = ["Programming Language :: Python :: Implementation :: CPython"]
dependencies = [
    # ordered-json의 Python wheel(release v0.0.8). polyspec 의존성은 release asset과 그 sha256의 direct reference다(docs/packaging.md, kit K49).
    "polyspec-ordered-json @ https://github.com/polyspec/ordered-json/releases/download/v0.0.8/polyspec_ordered_json-0.0.8-py3-none-any.whl#sha256=db981125f5ed860ebe242e6afd18015c7cc29719b0ab200ceed44aedefec645a",
    "cryptography==50.0.2",
    "PyMySQL==1.2.3",
    # psycopg[binary]==3.3.6과 같은 설치: extra binary가 psycopg-binary==3.3.6을 요구한다.
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "PyYAML==6.0.3",
]

[project.scripts]
orm-gen = "polyspec.orm.bin_orm_gen:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
# polyspec.orm.testing은 test entry point다(docs/protocol.md "Test faults"). 배포는 그것을 담고, package entry
# point polyspec.orm은 그것을 import하지 않는다.

[tool.setuptools.package-data]
"polyspec.orm" = ["py.typed"]
