[package]
name = "polyspec-orm-interface-symbols"
version = "0.0.22"
edition = "2021"
rust-version = "1.99.0"
publish = false

[workspace]

# The lints of make lint-rust (T391): every warning fails, and so does an error dropped by a must_use value (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
serde_json = "1"

[dev-dependencies]
polyspec-orm-testcase = { path = "../../testcase" }
