[package]
# Its integration tests run as groups of the one test program, packages/rust/programs/tests/all.
autotests = false
name = "polyspec-orm-build"
version = "0.0.31"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "Build-time model generator for the Rust ORM: reads a dbspec document set and generates the models that the crate source calls"
license = "MIT"
repository = "https://github.com/polyspec/orm"
readme = "../README.md"
keywords = ["orm", "codegen", "build"]
categories = ["database", "development-tools::build-utils"]

[dependencies]
polyspec-orm-schema = { version = "=0.0.31", path = "../schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "bigdecimal"] }
bigdecimal = { version = "=0.4.11", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync"] }
polyspec-orm = { version = "=0.0.31", path = "..", optional = true }
url = { version = "2", optional = true }
futures-util = { version = "=0.3.34", optional = true }
sqlparser = { version = "=0.63.0", features = ["visitor"], optional = true }

[features]
# The catalog and tool_db database connections need the driver.
live-db = ["dep:polyspec-orm", "dep:sqlx", "dep:tokio", "dep:url", "dep:futures-util", "dep:sqlparser", "dep:bigdecimal"]
# The driver seam of the catalog tests (tool_db::script, T431); no default feature enables it.
test-faults = ["live-db"]

[dev-dependencies]
# Test cases report their start, result, elapsed time, and their own deadline.
polyspec-orm-testcase = { path = "../testcase" }
polyspec-orm-case-clock = { path = "../case-clock" }
# The live-db tests need the feature of this crate: a self dev-dependency enables it for the test targets only.
polyspec-orm-build = { path = ".", features = ["live-db", "test-faults"] }

[lints]
workspace = true
