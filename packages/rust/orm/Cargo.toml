[package]
name = "polyspec-orm"
version = "0.0.18"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "Rust ORM: model runtime, SQL planner, and sqlx executor"
license = "MIT"
repository = "https://github.com/polyspec/orm"
readme = "../README.md"
keywords = ["orm", "mysql", "postgres", "sqlite", "sqlx"]
categories = ["database"]

[features]
# The test entry point is polyspec_orm::testing. The build has it only when this feature is enabled,
# and no default feature enables it.
test-faults = []

[dependencies]
polyspec-orm-schema = { version = "=0.0.18", path = "../schema" }
ordered-json = { package = "polyspec-ordered-json", version = "=0.0.9", git = "https://github.com/polyspec/ordered-json.git", tag = "v0.0.9" }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "tls-rustls-ring-native-roots", "chrono", "rust_decimal", "json", "ipnet"] }
# The SQLite library bundled with sqlx. The connection does not ask for that version via SQL; it reads it from this crate.
libsqlite3-sys = "0.37"
rust_decimal = "1"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
# sqlx-postgres uses whoami without its std feature, which reports the OS user
# as "anonymous"; a DSN without a user must connect as the OS user.
whoami = "2"
rand = "0.10"
flate2 = "1"
futures-util = "0.3"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
saphyr-parser = "0.2.1"
serde-saphyr = "2.0.0"

[dev-dependencies]
# The fault entry point exists only with the feature test-faults. The integration tests of this crate
# enable it through their own crate, so a test target runs with the feature and the normal build does not.
polyspec-orm = { path = ".", features = ["test-faults"] }
# The test case reports its start, result, elapsed time, and its own deadline.
polyspec-orm-testcase = { path = "../testcase" }
# Used by the test that rejects the end-of-transaction statement with the SQLite authorizer. It is the same version as sqlx-sqlite.
libsqlite3-sys = { version = "0.37", default-features = false }
# The coverage test measures the CPU time of its own computation.
polyspec-orm-case-clock = { path = "../case-clock" }
# The database case creates its own database and deletes it when it ends.
polyspec-orm-case-database = { path = "../case-database" }
# The registration test installs a logger that counts sqlx's statement log records. It is the version sqlx uses.
log = "0.4"

# These test targets run a shared vector file with one libtest-mimic trial per case id
# (polyspec_orm_testcase::trial), so their harness is libtest-mimic.
[[test]]
name = "codec_vectors"
path = "tests/codec_vectors.rs"
harness = false

[[test]]
name = "codec_aes_vectors"
path = "tests/codec_aes_vectors.rs"
harness = false

[[test]]
name = "code_catalog"
path = "tests/code_catalog.rs"
harness = false

[[test]]
name = "ir_validate"
path = "tests/ir_validate.rs"
harness = false

[[test]]
name = "dbspec_introspect"
path = "tests/dbspec_introspect.rs"
harness = false

[[test]]
name = "decimal_model"
path = "tests/decimal_model.rs"
harness = false

[[test]]
name = "statement_events"
path = "tests/statement_events.rs"
harness = false

[[test]]
name = "identity_load"
path = "tests/identity_load.rs"
harness = false

[[test]]
name = "install"
path = "tests/install.rs"
harness = false

[[test]]
name = "sqlite_file_name"
path = "tests/sqlite_file_name.rs"
harness = false

[[test]]
name = "statement_fault"
path = "tests/statement_fault.rs"
harness = false

[lints]
workspace = true
