[package]
name = "polyspec-orm-case-database"
version = "0.0.18"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "A database of its own for each Rust ORM test case, dropped when the case ends"
license = "MIT"

[dependencies]
# The management connection is opened with orm, the same DSN resolution the tests use.
polyspec-orm = { path = "../orm" }
# Reports the databases it created and dropped as STEP lines of the running case.
polyspec-orm-testcase = { path = "../testcase" }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres"] }
tokio = { version = "1", features = ["rt"] }
url = "2"

[lints]
workspace = true
