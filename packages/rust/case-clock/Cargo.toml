[package]
name = "polyspec-orm-case-clock"
version = "0.0.18"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "Thread CPU time for the time bounds that the Rust ORM tests set on their own computation"
license = "MIT"

[dependencies]
rustix = { version = "1.1.5", features = ["time"] }

[dev-dependencies]
# The test case reports its start, result, elapsed time, and its own deadline.
polyspec-orm-testcase = { path = "../testcase" }

[lints]
workspace = true
