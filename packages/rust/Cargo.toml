[workspace]
resolver = "2"
members = ["case-clock", "case-database", "orm", "build", "schema", "testcase", "test-support", "tests"]

# The dependencies build without debug information: each feature set of a test build writes its own copy of every dependency into
# target/debug/deps, and their line tables only scale those copies. The crates of this workspace keep the debug level of the dev
# profile (line-tables-only on main, 0 in a worktree), so their panics and assertions still name file:line (KSTD-5-93).
[profile.dev.package."*"]
debug = 0

# The lints of make lint-rust (T391): every warning fails, and so does an error dropped by a must_use value (P8).
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
