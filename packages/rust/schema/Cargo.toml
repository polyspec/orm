[package]
name = "polyspec-orm-schema"
version = "0.0.16"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "dbspec schema documents for the Rust ORM: parse, canonical emit, manifest, runtime model, dialect statements, plans and Mermaid export"
license = "MIT"
repository = "https://github.com/polyspec/orm"
readme = "../README.md"
keywords = ["orm", "schema", "ddl", "migration"]
categories = ["database"]

[dependencies]
sha2 = "0.10"
regex = "1"
# The set reader (dbspec::read_set) takes each listed file's identity from its open handle.
same-file = "1.0.6"
# The set reader parses the set file with serde_json; raw values keep a number unconverted and
# the visitor hooks of serde detect a key that appears twice and the nesting depth.
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
# test case가 시작, 결과, 경과 시간과 자기 기한을 보고한다.
polyspec-orm-testcase = { path = "../testcase" }
polyspec-orm-case-clock = { path = "../case-clock" }

# These test targets run a shared vector file with one libtest-mimic trial per case id
# (polyspec_orm_testcase::trial), so their harness is libtest-mimic.
[[test]]
name = "dbspec"
path = "tests/dbspec.rs"
harness = false

[[test]]
name = "dbspec_manifest"
path = "tests/dbspec_manifest.rs"
harness = false

[[test]]
name = "dbspec_mermaid"
path = "tests/dbspec_mermaid.rs"
harness = false

[[test]]
name = "dbspec_plan"
path = "tests/dbspec_plan.rs"
harness = false

[[test]]
name = "dbspec_render"
path = "tests/dbspec_render.rs"
harness = false

[[test]]
name = "dbspec_set"
path = "tests/dbspec_set.rs"
harness = false

[lints]
workspace = true
