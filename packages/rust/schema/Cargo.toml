[package]
# Its integration tests run as groups of the one test program, packages/rust/tests/tests/all.
autotests = false
name = "polyspec-orm-schema"
version = "0.0.24"
edition = "2021"
rust-version = "1.99.0"
publish = false
description = "dbspec schema documents for the Rust ORM: parse, canonical emit, manifest, runtime model, dialect statements, plans and Mermaid export"
license = "MIT"
repository = "https://github.com/polyspec/orm"
readme = "../README.md"
keywords = ["orm", "schema", "ddl", "migration"]
categories = ["database"]

[dependencies]
sha2 = "0.10"
regex = "1"
# The set reader (dbspec::read_set) takes each listed file's identity from its open handle.
same-file = "1.0.6"
# The set reader parses the set file with serde_json; raw values keep a number unconverted and
# the visitor hooks of serde detect a key that appears twice and the nesting depth.
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
# Reports the test case's start, result, elapsed time, and its own deadline.
polyspec-orm-testcase = { path = "../testcase" }
polyspec-orm-case-clock = { path = "../case-clock" }
# The helpers that the test targets share: the temporary directory and the feature fixture cases.
polyspec-orm-test-support = { path = "../test-support" }
# The shared dbspec vectors are read against their JSON Schemas (tests/dbspec/schema); the schemas name no remote or file
# reference, so the resolvers and TLS of the default features are left out.
jsonschema = { version = "=0.58.6", default-features = false }

[lints]
workspace = true
