[package]
name = "polyspec-orm-tests"
version = "0.0.18"
edition = "2021"
rust-version = "1.99.0"
publish = false
build = "build.rs"

[[bin]]
name = "integration"
path = "src/integration.rs"

[[bin]]
name = "client_bench"
path = "src/client_bench.rs"

[[bin]]
name = "conformance"
path = "src/conformance.rs"

[[bin]]
name = "complex"
path = "../../../examples/complex/rust/main.rs"

[[bin]]
name = "demo"
path = "../../../examples/thin-slice/rust/main.rs"

# markdown_conformance needs the flowmark server, so it is left out of every test in the workspace, and make
# Runs markdown-conformance-check/rust with FLOWMARK and --test markdown_conformance.
# One libtest-mimic trial per conformance vector of each dialect (polyspec_orm_testcase::trial). Its trials read the
# seeded bench databases of the run (BENCH_*_DSN), which make orm-check and the runner of a run give.
[[test]]
name = "coverage_conformance_verification"
path = "tests/coverage_conformance_verification.rs"
harness = false

[[test]]
name = "markdown_conformance"
path = "tests/markdown_conformance.rs"
test = false
# Each case of tests/markdown/cases.json is a libtest-mimic trial named by its id (polyspec_orm_testcase::trial).
harness = false

[dependencies]
# The integration program reports each case's start, result, elapsed time, and its own deadline.
polyspec-orm-testcase = { path = "../testcase" }
# the conformance runner fixes the executor clock through the test entry point polyspec_orm::testing.
polyspec-orm = { path = "../orm", features = ["test-faults"] }
# The integration program's database case creates its own database and drops it when it ends.
polyspec-orm-case-database = { path = "../case-database" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The coverage test runs the same generator and live-db catalog as build.rs.
[dev-dependencies]
polyspec-orm-build = { path = "../build", features = ["live-db"] }

[build-dependencies]
polyspec-orm-build = { path = "../build" }

[lints]
workspace = true
