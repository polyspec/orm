[package]
name = "polyspec-orm-tests"
version = "0.0.21"
edition = "2021"
rust-version = "1.99.0"
publish = false
build = "build.rs"

# The helpers that the test programs share: the recipe helper (docs/spec/feature-coverage.md FCV-2 to FCV-4).
[lib]
path = "src/lib.rs"

[[bin]]
name = "client_bench"
path = "src/client_bench.rs"

[[bin]]
name = "conformance"
path = "src/conformance.rs"

[[bin]]
name = "complex"
path = "../../../examples/complex/rust/main.rs"

[[bin]]
name = "demo"
path = "../../../examples/thin-slice/rust/main.rs"

# markdown_conformance needs the flowmark server, so it is left out of every test in the workspace, and make
# Runs markdown-conformance-check/rust with FLOWMARK and --test markdown_conformance.
# One libtest-mimic trial per conformance vector of each dialect (polyspec_orm_testcase::trial). Its trials read the
# seeded bench databases of the run (BENCH_*_DSN), which make orm-check and the runner of a run give.
[[test]]
name = "coverage_conformance_verification"
path = "tests/coverage_conformance_verification.rs"
harness = false

# Each case of the read answer recipe, tests/ir/answers.json, is the trial ir_answers::<case id> (FCV-3).
[[test]]
name = "ir_answers"
path = "tests/ir_answers.rs"
harness = false

# Each case of the codec recipe, tests/codec/codec.json, is the trial codec_none::<case id> (FCV-3).
[[test]]
name = "codec_none"
path = "tests/codec_none.rs"
harness = false

# Each case of the catalog_connection recipe, contracts/fixtures/catalog_connection/catalog_connection.json, is the
# trial catalog_connection_<database>::<case id> on a case database of its own (FCV-3).
[[test]]
name = "catalog_connection_mysql"
path = "tests/catalog_connection_mysql.rs"
harness = false

[[test]]
name = "catalog_connection_postgres"
path = "tests/catalog_connection_postgres.rs"
harness = false

[[test]]
name = "catalog_connection_sqlite"
path = "tests/catalog_connection_sqlite.rs"
harness = false

[[test]]
name = "codec_integer_beyond_i64_none"
path = "tests/codec_integer_beyond_i64_none.rs"
harness = false

[[test]]
name = "markdown_conformance"
path = "tests/markdown_conformance.rs"
test = false
# Each case of tests/markdown/cases.json is a libtest-mimic trial named by its id (polyspec_orm_testcase::trial).
harness = false

[dependencies]
# The integration program reports each case's start, result, elapsed time, and its own deadline.
polyspec-orm-testcase = { path = "../testcase" }
# the conformance runner fixes the executor clock through the test entry point polyspec_orm::testing.
polyspec-orm = { path = "../orm", features = ["test-faults"] }
# The integration program's database case creates its own database and drops it when it ends.
polyspec-orm-case-database = { path = "../case-database" }
# The database path of the recipe helper connects the live catalog of orm-build to the case database.
polyspec-orm-build = { path = "../build", features = ["live-db"] }
# The binaries of the examples, the benchmark client and the integration program import the shared helpers from it.
polyspec-orm-test-support = { path = "../test-support" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cpu-time = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The coverage test runs the same generator and live-db catalog as build.rs.
[dev-dependencies]
polyspec-orm-build = { path = "../build", features = ["live-db"] }

[build-dependencies]
polyspec-orm-build = { path = "../build" }

[lints]
workspace = true

# Each case of the schema_install recipe, contracts/fixtures/schema_install/schema_install.json, is the trial
# schema_install_<database>::<case id> on a case database of its own (FCV-3).
[[test]]
name = "schema_install_mysql"
path = "tests/schema_install_mysql.rs"
harness = false

[[test]]
name = "schema_install_postgres"
path = "tests/schema_install_postgres.rs"
harness = false

[[test]]
name = "schema_install_sqlite"
path = "tests/schema_install_sqlite.rs"
harness = false
