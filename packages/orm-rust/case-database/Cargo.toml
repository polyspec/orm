[package]
name = "polyspec-orm-case-database"
version = "0.0.7"
edition = "2021"
publish = false
description = "A database of its own for each Rust ORM test case, dropped when the case ends"
license = "MIT"

[dependencies]
# 관리 연결은 test와 같은 DSN 해석을 쓰도록 orm으로 연다.
polyspec-orm = { path = "../orm" }
# 만든 database와 지운 database를 실행 중인 case의 STEP 줄로 보고한다.
polyspec-orm-testcase = { path = "../testcase" }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres"] }
tokio = { version = "1", features = ["rt"] }
url = "2"
