# Generated by binding from the interface contract; do not edit. Run make bindings to write it again.
[package]
name = "polyspec-orm-go"
version = "0.0.31"
edition = "2021"
rust-version = "1.99.0"
publish = false

[lib]
name = "polyspec_orm_go"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
panic-test = []
codec-test = []

[dependencies]
polyspec-orm = { path = "../../../rust" }
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core", features = ["construct"] }


[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
