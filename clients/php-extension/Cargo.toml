[package]
name = "orm-php-extension"
version = "0.0.2"
edition = "2021"
publish = false
description = "PHP extension orm_dbspec: the dbspec interface of orm-schema as PHP classes"
license = "MIT"
repository = "https://github.com/polyspec/orm"

[lib]
name = "orm_dbspec"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.15.15"
orm-schema = { path = "../rust/orm-schema" }

[workspace]
