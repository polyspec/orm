[package]
name = "orm"
version = "0.0.1"
edition = "2021"
publish = false
description = "Rust executor for the orm engine: wasm compiler boundary, plan cache, sqlx runner"

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
wasmtime = "48"
wasmtime-wasi = "48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.10"
