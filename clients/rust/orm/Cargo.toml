[package]
name = "orm"
version = "0.0.1"
edition = "2021"
publish = false
description = "Rust executor for the orm engine: wasm compiler boundary, plan cache, sqlx runner"
license = "MIT"
repository = "https://github.com/polyspec/orm"
readme = "../README.md"
keywords = ["orm", "mysql", "postgres", "sqlite", "sqlx", "wasm"]
categories = ["database"]

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "rust_decimal", "json", "ipnet"] }
rust_decimal = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
wasmtime = "48"
wasmtime-wasi = "48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
async-trait = "0.1"
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.10"
flate2 = "1"
base64 = "0.22"
toml = "0.9"
aes = "0.8"
serde_yaml_ng = "0.10.0"
yaml-rust2 = { version = "0.13.0", default-features = false }
