[package]
name = "orm-build"
version = "0.0.1"
edition = "2021"
publish = false
description = "Build-time model generator for the Rust ORM: reads a dbspec document set and generates the models that the crate source calls"
license = "MIT"
repository = "https://github.com/polyspec/orm"
readme = "../README.md"
keywords = ["orm", "codegen", "build"]
categories = ["database", "development-tools::build-utils"]

[dependencies]
orm-schema = { version = "=0.0.1", path = "../orm-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
sqlx = { version = "0.9", optional = true, features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "bigdecimal"] }
bigdecimal = { version = "=0.4.11", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync"] }
orm = { version = "=0.0.1", path = "../orm", optional = true }
url = { version = "2", optional = true }
futures-util = { version = "=0.3.34", optional = true }
sqlparser = { version = "=0.63.0", features = ["visitor"], optional = true }

[features]
# catalog과 tool_db의 database connection은 driver가 필요하다.
live-db = ["dep:orm", "dep:sqlx", "dep:tokio", "dep:url", "dep:futures-util", "dep:sqlparser", "dep:bigdecimal"]

[dev-dependencies]
orm-case-clock = { path = "../case-clock" }

[[test]]
name = "catalog"
required-features = ["live-db"]

[[test]]
name = "tool_cells"
required-features = ["live-db"]

[[test]]
name = "tool_values"
required-features = ["live-db"]

[[test]]
name = "tool_limits"
required-features = ["live-db"]

[[test]]
name = "tool_statement"
required-features = ["live-db"]

[[test]]
name = "tool_columns"
required-features = ["live-db"]

[[test]]
name = "read_only_query"
required-features = ["live-db"]

[[test]]
name = "grid_cells"
required-features = ["live-db"]

[[test]]
name = "grid_numbers"
required-features = ["live-db"]

[[test]]
name = "grid_decimals"
required-features = ["live-db"]

[[test]]
name = "grid_temporal"
required-features = ["live-db"]

[[test]]
name = "table_metadata"
required-features = ["live-db"]

[[test]]
name = "table_page"
required-features = ["live-db"]

[[test]]
name = "row_snapshot"
required-features = ["live-db"]

[[test]]
name = "typed_binds"
required-features = ["live-db"]

[[test]]
name = "row_mutation"
required-features = ["live-db"]

[[test]]
name = "row_commit_permit"
required-features = ["live-db"]

[[test]]
name = "row_insert_identity"
required-features = ["live-db"]
