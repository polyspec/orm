[package]
name = "orm-tests"
version = "0.0.1"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "integration"
path = "src/integration.rs"

[[bin]]
name = "client_bench"
path = "src/client_bench.rs"

[[bin]]
name = "conformance"
path = "src/conformance.rs"

[[bin]]
name = "complex"
path = "../../../examples/complex/rust/main.rs"

[[bin]]
name = "demo"
path = "../../../examples/thin-slice/rust/main.rs"

[dependencies]
orm = { path = "../orm" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"

[build-dependencies]
orm-build = { path = "../orm-build" }
