syntax = "proto3";

package orm.compiler.v1;

option go_package = "github.com/polyspec/orm/proto/orm/compiler/v1;compilerv1";

service CompilerService {
  rpc Compile(CompileRequest) returns (CompileResponse);
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);
}

message CompileRequest {
  uint32 ir_version = 1;
  string schema_hash = 2;
  QueryKind kind = 3;
  QueryNode root = 4;
  repeated Assignment set = 5;
  repeated Assignment on_duplicate = 6;
  Optimistic optimistic = 7;
  Raw raw = 8;
  uint32 parameter_count = 9;
  string aggregate = 10;
  bool debug = 11;
}

enum QueryKind {
  QUERY_KIND_UNSPECIFIED = 0;
  QUERY_KIND_ONE = 1;
  QUERY_KIND_ALL = 2;
  QUERY_KIND_COUNT = 3;
  QUERY_KIND_GROUP_COUNT = 4;
  QUERY_KIND_COUNT_DISTINCT = 5;
  QUERY_KIND_SUM = 6;
  QUERY_KIND_AVG = 7;
  QUERY_KIND_MIN = 8;
  QUERY_KIND_MAX = 9;
  QUERY_KIND_PAGINATE = 10;
  QUERY_KIND_INSERT = 11;
  QUERY_KIND_UPDATE = 12;
  QUERY_KIND_DELETE = 13;
  QUERY_KIND_RAW = 14;
}

message QueryNode {
  string entity = 1;
  Projection columns = 2;
  Group on = 3;
  Group where = 4;
  Group having = 5;
  repeated Join joins = 6;
  repeated Relation relations = 7;
  repeated Order order = 8;
  repeated string group_by = 9;
  repeated GroupExpression group_by_expression = 10;
  Limit limit = 11;
  bool distinct = 12;
  string force_index = 13;
  string key_by = 14;
  bool flatten = 15;
  uint32 limit_per_parent = 16;
  IfParent if_parent = 17;
  bool drop_child_key = 18;
  bool no_cascade_delete = 19;
  optional uint32 scope_parameter = 20;
}

message Projection {
  enum Mode {
    MODE_DEFAULT = 0;
    MODE_ALL = 1;
    MODE_NONE = 2;
  }
  Mode mode = 1;
  repeated string add = 2;
  repeated string remove = 3;
  map<string, string> aliases = 4;
  map<string, string> expressions = 5;
}

message Join { string relation = 1; string kind = 2; QueryNode query = 3; }
message Relation { string relation = 1; QueryNode query = 2; }
message Group { string connector = 1; repeated Item items = 2; }
message Item {
  oneof value {
    Predicate predicate = 1;
    Group group = 2;
    Navigation navigation = 3;
  }
}
message Navigation { string connector = 1; string relation = 2; Group group = 3; }
message Predicate {
  string connector = 1;
  string column = 2;
  string operator = 3;
  optional uint32 parameter = 4;
  repeated uint32 parameters = 5;
  ColumnReference reference = 6;
  string expression = 7;
  repeated string match_columns = 8;
}
message ColumnReference { string path = 1; string column = 2; }
message Order { string column = 1; string expression = 2; bool descending = 3; }
message GroupExpression { string expression = 1; string alias = 2; }
message Limit { uint32 offset = 1; uint32 count = 2; }
message IfParent { string column = 1; uint32 parameter = 2; }
message Assignment {
  string column = 1;
  optional uint32 parameter = 2;
  bool set_null = 3;
  string expression = 4;
  repeated uint32 expression_parameters = 5;
  optional uint32 plus_parameter = 6;
  optional uint32 minus_parameter = 7;
}
message Optimistic { string column = 1; uint32 parameter = 2; }
message Raw { string sql = 1; repeated uint32 parameters = 2; }

message CompileResponse {
  oneof result {
    Plan plan = 1;
    CompileError error = 2;
  }
}
message Plan { string schema_hash = 1; QueryKind kind = 2; repeated PlanStep steps = 3; }
message PlanStep {
  uint32 id = 1;
  string role = 2;
  string sql = 3;
  repeated BindSlot binds = 4;
  Assemble assemble = 5;
  ParentReference parent = 6;
}
message BindSlot {
  string source = 1;
  uint32 parameter = 2;
  string transform = 3;
  string name = 4;
  uint32 step = 5;
  string column = 6;
  repeated string host_styles = 7;
  string column_type = 8;
}
message KeyReference { string column = 1; uint32 index = 2; }
message ParentReference {
  uint32 step = 1;
  reserved 2, 3;
  ParentCondition if_parent = 4;
  repeated KeyReference keys = 5;
}
message ParentCondition { string column = 1; uint32 index = 2; uint32 parameter = 3; }
message Assemble { string entity = 1; string alias = 2; repeated OutputColumn columns = 3; repeated Child children = 4; }
message OutputColumn {
  uint32 index = 1;
  string name = 2;
  string column = 3;
  string type = 4;
  repeated string styles = 5;
  bool hidden = 6;
}
message Child {
  string relation = 1;
  string kind = 2;
  uint32 step = 3;
  reserved 4, 5, 6, 7, 8, 9;
  bool flatten = 10;
  bool cascade = 11;
  Assemble assemble = 12;
  repeated KeyReference parent_keys = 13;
  repeated KeyReference child_keys = 14;
  repeated KeyReference key = 15;
}
message CompileError { string code = 1; string message = 2; }
message GetMetadataRequest {}
message GetMetadataResponse { string schema_hash = 1; string dialect = 2; uint32 ir_version = 3; }
